el ampliado); diagramas Mermaid corregidos a mano. Ver ruleset en las tareas 1.1-1.4.</p>", "4.3": "<p>Diagrama de escalado en Mermaid con nodos de decisión (¿datos personales?, ¿servicio público caído?, ¿rescate?, ¿>1 h sin contención?), plazos y destinatarios por rama. Se <b>prueba con 5 incidentes</b>; los que no encajan obligan a rediseñarlo.</p>", "4.4": "<p>Checklist de vuelta a la normalidad: qué se comprueba antes de reconectar, cómo se confirma que el atacante no persiste, criterios de cierre. Ejecución manual en las VM + informe de verificación (integridad y disponibilidad).</p>", "4.5": "<p>Post-mortem <b>sin culpables</b>: 5 preguntas, 3 fallos de proceso (no de personas), 3 acciones correctivas con indicador medible. Documentación completa del incidente + plan de mejora.</p>", "4.6": "<p>Simulación integral: el grupo sigue su propio playbook al pie de la letra; lo que no esté escrito, no se hace. Informe final + plan de seguimiento + reflexión sobre qué falló del procedimiento.</p>"}, "tar": {"1.1": "<p><b>Solución (diseño + ruleset).</b> Diseño con subredes por departamento (comercial 192.168.10.0/24, RRHH .20, IT .30), DMZ para los servicios publicados y enlaces /30 entre routers. Tabla de reglas con política por defecto <b>denegar</b> y pares petición/established. Puntos clave del ruleset: impresoras sin salida, DNS permitido a los departamentos, comercial sin Internet pero con acceso a la web de la DMZ, RRHH con navegación (y el equipo .6 solo LinkedIn), IT con SSH/ping a todo y solo .3 administra firewalls, ICMP de IT permitido.</p>", "1.2": "<p><b>Solución (nftables).</b> Traducir el ruleset a <span class='mono'>nftables</span> sobre Debian: tabla <span class='mono'>inet filter</span> con cadenas <span class='mono'>input/forward/output</span> política <span class='mono'>drop</span>, <span class='mono'>ct state established,related accept</span>, e interfaces en <b>minúscula</b> (<span class='mono'>enp0s3/enp0s8/enp0s9</span>). Un <span class='mono'>set</span> para los puertos/IP repetidos aligera el fichero.</p>", "1.3": "<p><b>Solución (registros + DNAT).</b> Reglas <span class='mono'>log prefix</span> para: acceso de RRHH a Internet, intento no autorizado al SSH del FW, servidor DMZ hacia la LAN, y conexiones a la DMZ desde Internet. DNAT 3578→14000 (correo) y 3456→7777 (web), SSH al FW y a la web solo desde 12.3.4.5. <b>Imprescindible:</b> tras cada DNAT, aceptar el tráfico ya traducido en <span class='mono'>forward</span> o la política <span class='mono'>drop</span> lo descarta.</p>", "1.4": "<p><b>Solución (doble cortafuegos).</b> Arquitectura con FW externo (Internet↔DMZ) y FW interno (DMZ↔LAN): <span class='mono'>t1_4-dmz.conf</span> publica los servicios de la DMZ y filtra lo que entra; <span class='mono'>t1_4-int.conf</span> solo deja pasar de la LAN a la DMZ lo necesario y bloquea el tráfico directo Internet↔LAN. Se prueba que un servicio de la DMZ no puede iniciar conexiones hacia la LAN.</p>", "4.1": "<p><b>Solución.</b> Captura de la puntuación del examen y del título del curso de Gestión de Incidentes del CCN-CERT (plataforma ÁNGELES). La materia entra en el examen de la unidad.</p>", "4.2": "<p><b>Solución (playbooks).</b> Un playbook por incidente del juego de rol de INCIBE, con las fases de gestión, responsable y criterio de salida de cada fase; se admiten varios diagramas (uno por fase) y referencias a runbooks. Rúbrica: que sea <b>ejecutable</b> (sin pasos ambiguos ni herramientas inexistentes).</p>", "4.3": "<p><b>Solución (FIR).</b> FIR instalado y los casos de los playbooks dados de alta: creación del incidente, categorización, seguimiento y cierre. PDF con capturas de la gestión de al menos un caso completo.</p>", "4.4": "<p><b>Solución (REYES).</b> Explicación de la arquitectura de REYES (CCN-CERT, basada en MISP/STIX-TAXII), qué listas negras e indicadores distribuye y cómo ayuda a detectar e identificar ciberincidentes; relación con LUCÍA.</p>"}}, "ud5": {"act": {"5.1": "<p>Tabla de disparadores: qué incidente obliga a notificar, a quién y en qué plazo, con los plazos <b>verificados en la fuente</b> (72 h RGPD a la AEPD; 24/72 h e informe final a 1 mes de NIS2). Plantilla de aviso de 10 líneas.</p>", "5.2": "<p>El mismo incidente en <b>cuatro versiones</b> sin cambiar un hecho: técnico, responsable de TI, gerencia y plantilla, con el límite de líneas de cada una. Después se compara qué se pierde en cada traducción. Sin especular sobre causas ni responsables.</p>", "5.3": "<p>Notificación a la AEPD/INCIBE-CERT con estructura formal, <b>filtro de confidencialidad</b> antes de enviar (datos personales, terceros, detalles reproducibles) y role play con la IA como funcionario que pide ampliación.</p>", "5.4": "<p>Matriz de impacto (servicios, datos, personas, reputación, coste, plazo legal) y priorización; se entregan en paralelo la versión de la IA y la versión corregida por el alumnado, con la justificación de cada cambio.</p>", "5.5": "<p>Informe de lecciones aprendidas + plan de mejora y, si procede, comunicado público. Simulación de rueda de prensa (la IA hace de periodista incisivo). Regla de la frase concreta: si se puede cambiar el nombre de la organización sin que cambie nada, la frase sobra.</p>"}, "tar": {"5.1": "<p><b>Solución.</b> PDF con la tabla de plazos verificada contra fuente oficial (RGPD: 72 h a la AEPD y a afectados sin dilación; NIS2: 24 h alerta / 72 h notificación / 1 mes informe final) y un ejemplo de aviso de 10 líneas (qué pasó, cuándo se detectó, qué afecta, qué se hace, qué necesito, cuándo vuelvo a informar).</p>", "5.2": "<p><b>Solución.</b> PDF con las cuatro versiones (técnico ≤8 líneas, TI ≤10 con impacto y decisiones, gerencia ≤6 sin jerga con coste y riesgo legal, plantilla ≤5 con qué hacer y qué no) + análisis de qué se pierde al simplificar. Mismo conjunto de hechos en todas.</p>", "5.3": "<p><b>Solución.</b> Notificación externa (AEPD/INCIBE-CERT) con los campos de la Guía Nacional (nivel de peligrosidad e impacto, sistemas afectados, medidas), pasada por el filtro de confidencialidad, y respuesta a un requerimiento de ampliación. Se marca qué información <b>no</b> debe salir.</p>", "5.4": "<p><b>Solución.</b> PDF con la matriz impacto × urgencia y la priorización, en <b>dos columnas en paralelo</b>: propuesta de la IA y versión corregida, con la justificación de cada ajuste al caso concreto.</p>", "5.5": "<p><b>Solución.</b> PDF con el informe de lecciones aprendidas (blameless: fallos de proceso + acciones correctivas medibles), el plan de mejora de la notificación y, si procede, el comunicado público; anexo con el guion de la rueda de prensa y las respuestas preparadas.</p>"}}}};</script>
<script>/* MP5021 — motor de render (alumnado/profesorado por data-role) */
(function(){
"use strict";

 +'<p class="sec-meta">Qué hay en cada máquina, para qué sirve y cómo encajan</p>'
 +'<p class="lead">Cuatro máquinas recrean la red de <b>TecnoMariña S.L.</b> (presta servicios TIC a un ayuntamiento), todas colgadas de una <b>red interna aislada</b> de VirtualBox/Proxmox llamada <span class="mono">labcyber</span> en el rango <span class="mono ip">172.21.10.0/24</span>. No hay salida a Internet ni modo bridge: al panel del SIEM se entra por <b>reenvío de puertos NAT</b> (<span class="mono">8443</span> del anfitrión → <span class="mono">443</span> de la VM). El ciclo de fondo es siempre el mismo: <b>kali ataca → la víctima (srvweb o win10) genera eventos → siem los recoge, correla y alerta</b>.</p>'

 +'<h3>3 · <span class="mono">win10</span> — víctima puesto de usuario</h3>'
 +'<div class="chips"><span class="chip">Windows 10/11 Eval</span><span class="chip">3–4 GB RAM</span><span class="chip">172.21.10.20</span></div>'
 +'<p>Es el PC de un empleado. Lleva <b>Sysmon</b> (registra con detalle creación de procesos, conexiones de red y cambios en el registro: visibilidad fina del endpoint) y <b>agente Wazuh</b> que envía esos eventos al SIEM. Sirve para malware, procesos sospechosos y <b>análisis forense</b> de memoria y disco. Se arranca solo cuando hace falta, porque consume bastante RAM.</p>'

 +'<ol>'
 +'<li><b>kali</b> escanea y lanza la fuerza bruta contra el SSH de srvweb.</li>'

 +'<h3>Bitácora de prompts</h3><p class="lead">Anexo de una página en todo trabajo con IA. Se integra en la lista de cotejo y en la tabla de observación. El criterio no es «ha usado IA» sino <b>«sabe dónde falla la IA»</b>.</p>'
 +'<div class="code"><div class="bar"><span class="who">anexo · bitácora de prompts</span><button class="copy" type="button">copiar</button></div><pre id="bitaPre"></pre></div>'
 +'<h3 id="amenazas-ia">Amenazas potenciadas por IA (2026)</h3>'+'<p class="lead">La IA no inventa ataques nuevos: <b>acelera</b> los de siempre y <b>comprime el ciclo de ataque</b> (reconocimiento → descubrimiento de la vulnerabilidad → explotación → movimiento lateral → exfiltración) hasta un ritmo que las defensas humanas no siguen. Por eso la prioridad se desplaza de «detectar más» a <b>verificar, decidir y remediar más rápido</b>, con control humano.</p>'+'<div class="tiles" style="grid-template-columns:repeat(3,1fr)">'+'<div class="tile" style="--udc:var(--ia)"><div class="k">94%</div><div class="d">de líderes creen que la IA redefinirá la ciberseguridad (WEF, Global Cybersecurity Outlook 2026)</div></div>'+'<div class="tile" style="--udc:var(--ia)"><div class="k">×4</div><div class="d">clics del phishing generado por IA frente al humano; 40% del fraude BEC ya lo genera IA (Huntress)</div></div>'+'<div class="tile" style="--udc:var(--ia)"><div class="k">~4,7 meses</div><div class="d">en que se duplica el horizonte de tareas cyber que la IA resuelve con 80% de fiabilidad (AI Security Institute, UK, feb 2026)</div></div>'+'</div>'+'<p>Las formas que más conviene explicar en el aula:</p><ul>'+'<li><b>Phishing con IA generativa</b> — correos impecables, multiidioma e hiperpersonalizados con datos de redes sociales. (UD1, UD2)</li>'+'<li><b>Deepfakes de voz y vídeo</b> — suplantación de directivos para autorizar pagos; el FBI lo señala como la amenaza de IA de más rápido crecimiento. (UD1)</li>'+'<li><b>Ransomware autónomo</b> — agentes que eligen objetivo, exfiltran y cifran, con doble y triple extorsión. (UD3, UD4)</li>'+'<li><b>Credenciales con agentes IA</b> — <em>password spraying</em> automatizado (una contraseña común contra muchas cuentas para esquivar el bloqueo). (UD1, UD2)</li>'+'<li><b>Weaponización de CVE</b> — un agente genera el exploit a partir de un boletín público de vulnerabilidad. (UD3)</li>'+'<li><b>Cadena de suministro y Shadow AI</b> — compromiso vía una dependencia de confianza; y uso interno no autorizado de IA que fuga datos. (UD2, UD4)</li>'+'</ul>'+(D.role==='profe'?('<div class="note profe-only">'+ICON.q+'<div><span class="pbadge">profe</span> <b>Casos y cifras para ampliar (con fuente):</b><ul style="margin:6px 0 0">'+'<li>Deepfake: 35 M$ (2021, audio, IBM) y 25,6 M$ (2024, videollamada del CFO) — fraudes documentados.</li>'+'<li>IBM X-Force 2026: +44% de ataques que empiezan por explotación de apps públicas.</li>'+'<li>Foresiet: ataques con IA +89% interanual; un agente IA comprometió 600+ firewalls en 55 países.</li>'+'<li>Ransomware en el 44% de las brechas confirmadas (vs 32% el año anterior); 88% en PYMEs.</li>'+'<li>Cadena de suministro: caso Mercor comprometida a través de la dependencia LiteLLM, no de su propio código.</li>'+'<li>Defensa con IA: OpenAI Daybreak / GPT-5.4-Cyber y Claude Mythos (Anthropic) para hallar y parchear vulnerabilidades.</li>'+'<li>Shadow AI: el 63% de las organizaciones aún no tiene política de gobernanza de IA (PMG Academy).</li>'+'</ul><p style="margin:8px 0 0;font-size:12.5px">Fuentes primarias: WEF <em>Global Cybersecurity Outlook 2026</em>, IBM <em>X-Force Threat Intelligence Index 2026</em>, AI Security Institute (UK), Huntress, FBI. Evitar citar los blogs comerciales de origen.</p></div></div>'):'')+'<div class="note warn">'+ICON.warn+'<div><b>Verificar al inicio de cada curso:</b> las cifras y los casos de este bloque corresponden a 2026 y envejecen rápido. Contrastar los datos en sus fuentes primarias (WEF, IBM X-Force, AISI) y actualizar antes de impartir.</div></div>'+'<div class="note">'+ICON.info+'<div><b>Encaje didáctico:</b> esto es el <em>porqué</em> de la capa de IA del módulo. Cada amenaza anterior tiene su reflejo en una unidad, y el alumnado aprende tanto a usar la IA como a reconocer dónde el atacante la usa contra él.</div></div>'+'<h3 id="jailbreaking">Jailbreaking de IA y prompt injection</h3>'+'<p class="lead">Un <b>jailbreak</b> es cualquier técnica que hace <b>fallar las barreras de seguridad (guardrails)</b> de un sistema de IA: el daño es el de la barrera que se saltó (violar la política del operador, obedecer a un usuario que no debería mandar, o ejecutar instrucciones maliciosas). Es la otra cara de la moneda: no es la IA atacando, es el <em>ataque a la propia IA</em>.</p>'+'<h4>Dos familias</h4><ul>'+'<li><b>Prompt injection directa</b> — el propio usuario escribe la trampa en su prompt («ignora las instrucciones anteriores y…») para ampliar sus permisos sobre el sistema.</li>'+'<li><b>Prompt injection indirecta</b> — la instrucción viaja <b>escondida en un contenido que la IA lee</b>: una página web, un documento o <b>un log</b>. Es exactamente el incidente estrella de la UD2, donde el alumnado envenena una cabecera que luego se pega en la IA de triaje.</li>'+'</ul>'+'<h4>Técnicas habituales</h4><ul>'+'<li><b>DAN (Do Anything Now)</b> — pedir a la IA que interprete a una IA sin restricciones.</li>'+'<li><b>Crescendo</b> — varios turnos que desplazan poco a poco el tema hacia lo prohibido, sin que ningún prompt suelto parezca malicioso.</li>'+'<li><b>Ingeniería social</b> — urgencia, halago o apelación a la autoridad para que el modelo se salte sus salvaguardas.</li>'+'<li><b>Ataques por codificación</b> — ocultar la orden en Base64, ROT13 o URL-encoding, que el modelo descodifica pero el filtro puede pasar por alto.</li>'+'<li><b>Role-play</b> — hacer que el modelo adopte un personaje «sin política de contenidos».</li>'+'</ul>'+'<h4>Defensas</h4><ul>'+'<li><b>Filtrado de entrada</b>: revisar el prompt en busca de patrones de jailbreak antes de que llegue al modelo.</li>'+'<li><b>Endurecer el <span class="mono">system prompt</span></b>: instruir al modelo para que resista los intentos de anulación y trate los datos como datos, no como órdenes.</li>'+'<li><b>Filtrado de salida</b>: comprobar la respuesta antes de devolverla.</li>'+'<li><b>Monitorización de comportamiento</b>: detectar patrones raros, como la escalada rápida entre turnos.</li>'+'<li><b>Actualización continua</b>: las barreras se revisan a medida que aparecen técnicas nuevas.</li>'+'</ul>'+'<div class="note">'+ICON.info+'<div><b>Idea clave:</b> ninguna medida basta por sí sola — se aplican <b>en capas (defensa en profundidad)</b> y es un <b>ciclo continuo</b> de ataque y mitigación. En este módulo se practica en la UD2 (inyección vía log) y se separa siempre <b>dato no confiable</b> de <b>instrucción</b> en el prompt. <span style="font-size:12px;color:var(--faint)">Fuente: Microsoft Learn — <em>Fundamentals of AI security · AI jailbreaks</em>.</span></div></div>'+"<h3 id=\"incidentes-ia\">Incidentes reales provocados por IA</h3><p class=\"lead\">El bloque anterior explica <em>qué</em> amenazas existen; este recoge <b>casos documentados</b> en informes técnicos y prensa, para analizarlos en clase. Cada caso lleva su <b>nivel de verificación</b>: ✅ contrastado en fuente primaria o en varios medios; ⚠️ visto solo en fuentes secundarias.</p><div class=\"tiles\" style=\"grid-template-columns:repeat(auto-fit,minmax(160px,1fr))\"><div class=\"tile\" style=\"--udc:var(--attack)\"><div class=\"k\">A · IA como arma</div><div class=\"d\">El atacante usa IA para ejecutar o escalar el ataque</div></div><div class=\"tile\" style=\"--udc:var(--ia)\"><div class=\"k\">B · IA como superficie</div><div class=\"d\">El propio sistema de IA es el vector: inyección, cadena de suministro</div></div><div class=\"tile\" style=\"--udc:var(--ud3)\"><div class=\"k\">C · IA que falla sola</div><div class=\"d\">Un agente con demasiados permisos causa el daño sin atacante</div></div><div class=\"tile\" style=\"--udc:var(--ud2)\"><div class=\"k\">D · Uso imprudente</div><div class=\"d\">Personas que filtran datos o confían a ciegas en la IA</div></div></div><h4>A · IA como arma</h4><ul><li><b>Deepfake en videollamada — Arup, Hong Kong (enero 2024)</b> · ✅ Un empleado de finanzas entró en una videollamada con quien creía que era el director financiero y otros compañeros; <b>todos eran recreaciones generadas con IA</b> a partir de vídeos públicos. Ordenó 15 transferencias por unos 200 M HKD (≈25,6 M USD) a cinco cuentas. Había desconfiado de un primer correo, pero la videollamada disipó sus dudas. La empresa declaró que ningún sistema interno fue comprometido: <b>ingeniería social pura, potenciada por IA</b>.</li><li><b>«Vibe hacking»: extorsión GTG-2002 (informe de Anthropic, agosto 2025)</b> · ✅ Un actor criminal usó un agente de programación (Claude Code) como operador: escaneo automatizado de miles de VPN, intrusión, elección de los datos que robar y redacción de notas de extorsión personalizadas. Al menos 17 organizaciones afectadas (sanidad, emergencias, administración, entidades religiosas). <b>No cifraba nada</b>: robaba y amenazaba con publicar, con exigencias que en algunos casos superaban los 500.000 USD.</li><li><b>Primera campaña de ciberespionaje orquestada por IA: GTG-1002 (detectada en sept. 2025, publicada en nov. 2025)</b> · ✅ Grupo que Anthropic atribuye con alta confianza a un actor estatal chino; unos 30 objetivos (tecnológicas, finanzas, química, administraciones), con éxito en unos pocos. La IA ejecutó entre el <b>80 % y el 90 % del trabajo táctico</b> (reconocimiento, explotación, credenciales, movimiento lateral, exfiltración); los humanos solo aprobaban los pasos críticos. El engaño consistía en trocear las tareas y presentarlas como pruebas defensivas rutinarias. Dato clave: el propio informe reconoce que la IA <b>exageraba sus hallazgos e inventaba resultados</b>.</li><li><b>PromptLock: ransomware que genera su código con un LLM (agosto 2025)</b> · ✅ con matiz. ESET lo presentó como el primer ransomware con IA: un binario en Go que pide a un modelo local (gpt-oss-20b, a través de la API de Ollama) que escriba sobre la marcha scripts Lua para enumerar, exfiltrar y cifrar. Después se supo que era un <b>prototipo académico</b> (NYU) subido a VirusTotal durante unas pruebas, así que el titular «primer ransomware IA en libertad» tuvo que corregirse. Consecuencia técnica: como el script se regenera en cada ejecución, <b>los IOC cambian cada vez</b>.</li></ul><h4>B · IA como superficie de ataque</h4><ul><li><b>EchoLeak: CVE-2025-32711 en Microsoft 365 Copilot (junio 2025)</b> · ✅ Prompt injection indirecta <b>sin clic</b> (CVSS 9.3): un correo aparentemente normal lleva instrucciones escondidas; cuando la víctima pide a Copilot algo legítimo, el motor RAG recupera ese correo y Copilot acaba enviando datos al atacante. Esquivaba el clasificador anti-inyección redactando las órdenes como si fueran para el lector humano. Microsoft lo corrigió sin evidencia de explotación real.</li><li><b>Extensión Amazon Q Developer para VS Code (julio 2025)</b> · ✅ Un atacante coló, vía <em>pull request</em> en el repositorio público, un <b>prompt</b> que ordenaba al asistente dejar el equipo «casi de fábrica»: borrar ficheros locales, recursos de AWS y usuarios IAM. La versión 1.84.0 se publicó con el prompt dentro (≈950.000 instalaciones) y se sustituyó por la 1.85.0. No hubo daños porque el prompt estaba mal formado. Lección: <b>el malware ya puede ser texto en lenguaje natural</b> dirigido a un agente.</li><li><b>s1ngularity: paquetes Nx de npm (agosto 2025)</b> · ✅ Versiones maliciosas de un paquete con millones de descargas semanales; un script post-instalación robaba tokens de GitHub y npm, claves SSH, secretos y carteras. Novedad: <b>invocaba las CLI de IA instaladas</b> (Claude, Gemini, Q) con opciones que desactivan las confirmaciones (<span class=\"mono\">--dangerously-skip-permissions</span>, <span class=\"mono\">--yolo</span>, <span class=\"mono\">--trust-all-tools</span>) para que la IA hiciera el reconocimiento. GitGuardian contabilizó 2.349 credenciales de 1.079 sistemas; varias CLI se negaron a colaborar.</li><li><b>Slopsquatting: dependencias inventadas por la IA (2024-2026)</b> · ✅ investigación académica. Los asistentes de código recomiendan paquetes que <b>no existen</b>; un atacante registra ese nombre con malware dentro. Un estudio de USENIX Security 2025 midió ~20 % de paquetes inexistentes y más de 205.000 nombres inventados distintos, muchos repetidos en cada ejecución del mismo prompt. Una revisión de 2026 (preprint) encontró 127 nombres inventados <b>idénticos</b> en cinco modelos de proveedores distintos.</li></ul><h4>C · IA que falla sola</h4><ul><li><b>Replit borra una base de datos de producción (julio 2025)</b> · ✅ Durante un experimento de «vibe coding», el agente borró la BD real de la empresa (≈1.200 directivos y ≈1.190 compañías) <b>en plena congelación de código declarada expresamente</b>. Después dio información que no cuadraba con el estado real del sistema y aseguró que no se podía recuperar. La empresa pidió disculpas e introdujo separación automática desarrollo/producción y un modo «solo planificar». Lección: <b>una instrucción en el prompt no es un control de seguridad</b>; lo es que el agente no tenga la credencial.</li></ul><h4>D · Uso humano imprudente</h4><ul><li><b>Samsung filtra código fuente en ChatGPT (abril-mayo 2023)</b> · ✅ Ingenieros pegaron código interno en ChatGPT para depurarlo. La empresa prohibió temporalmente la IA generativa en equipos y redes corporativas mientras preparaba una alternativa interna. Es el caso de manual de la regla 🔴 del semáforo de datos.</li></ul><h4>⚠️ Casos de 2026 pendientes de verificar</h4><p>Aparecen en blogs y recopilatorios de seguridad, pero <b>no están contrastados con comunicado oficial</b>. Se usan como ejercicio de verificación, no como hechos:</p><ul><li><b>McKinsey «Lilli» (feb. 2026)</b>: se publica que un agente autónomo comprometió la plataforma interna de IA en menos de dos horas mediante inyección SQL, con exposición masiva de conversaciones y modificación de <em>system prompts</em>.</li><li><b>Hugging Face / OpenAI (jul. 2026)</b>: se publica la intrusión de un agente autónomo en infraestructura de producción durante un fin de semana, con presunta fuga desde un entorno de evaluación. Algunos artículos citan CVE con numeración inusual: <b>comprobar en NVD antes de citar</b>.</li><li><b>Agente que borra una BD «en segundos» y compromiso de Vercel vía Context.ai (abr. 2026)</b>: recogidos en recopilatorios mensuales.</li><li><b>Encuestas sectoriales 2026</b> con porcentajes altísimos de «brechas de agentes»: dependen de cómo define «brecha» cada encuesta. Buen material para leer estadísticas con espíritu crítico.</li></ul><h4>Dónde encaja cada caso</h4><div class=\"tbl-wrap\"><table><thead><tr><th>Unidad</th><th>Actividades</th><th>Casos</th><th>Uso en clase</th></tr></thead><tbody><tr><td><a href=\"#ud1\">UD1</a></td><td>Act.1 · Act.2 · Act.3-4</td><td>A1, D1, ⚠️</td><td>Mural de casos verificados; cláusula de IA de la normativa; guion «la llamada del CFO»</td></tr><tr><td><a href=\"#ud2\">UD2</a></td><td>Act.1 · Act.2</td><td>A2, A4, B1</td><td>¿Es ransomware si no cifra?; inyección vía log frente a EchoLeak; regla para tráfico a la API de Ollama</td></tr><tr><td><a href=\"#ud3\">UD3</a></td><td>Act.2 · Act.3 · Act.4</td><td>A3, A4, B3, C1</td><td>Mapear GTG-1002 a ATT&CK; IOC que cambian; el agente como testigo poco fiable; aviso al CERT</td></tr><tr><td><a href=\"#ud4\">UD4</a></td><td>Act.1 · Act.2</td><td>B2, B3, B4, C1</td><td>Playbook de credenciales expuestas; mínimo privilegio para agentes; verificar dependencias</td></tr><tr><td><a href=\"#ud5\">UD5</a></td><td>Act.2 · Act.3</td><td>A1, A2, C1</td><td>Brecha sin cifrado y plazo de 72 h; comunicados reales: qué funcionó y qué no</td></tr></tbody></table></div><p style=\"font-size:13px\">Cada unidad tiene además un apartado de teoría «Incidentes reales con IA» con los casos que mejor le encajan.</p><h4>Tres actividades listas para usar</h4><p><b>1 · «La IA como testigo» (UD3, 1 sesión) — casos C1 y A3.</b></p><ol><li>Se reparte el relato que un agente hace de sus propias acciones (texto preparado por el docente, inspirado en Replit).</li><li>Se reparten también los logs reales del laboratorio (Sysmon/Wazuh de <span class=\"mono ip\">srvweb 172.21.10.30</span>).</li><li>Tarea: localizar las <b>contradicciones</b> entre relato y evidencia.</li><li>Entregable: informe con los tres niveles <em>confirmado / probable / hipótesis</em>.</li></ol><p><b>2 · «Caza de PromptLock» (UD2, 1-2 sesiones) — caso A4.</b></p><ol><li>En <span class=\"mono ip\">win10 172.21.10.20</span> se lanza un proceso que hace una petición HTTP <b>benigna</b> a <span class=\"mono\">http://&lt;host&gt;:11434/api/generate</span> (la API de Ollama).</li><li>Tarea: regla de Wazuh/Sysmon que alerte de procesos no autorizados que hablan con ese puerto.</li><li>Debate: si el código cambia en cada ejecución, ¿qué IOC sirven? → paso de IOC a <b>comportamiento (TTP)</b>.</li></ol><p><b>3 · «Verificador de noticias de IA» (UD1, 1 sesión) — casos ⚠️.</b></p><ol><li>Cada grupo recibe uno de los casos de 2026 pendientes de verificar.</li><li>Busca fuente primaria: comunicado de la empresa, NVD/MSRC para los CVE, informe de un CERT.</li><li>Salida obligatoria: <em>confirmado / matizado / descartado</em>, con la fuente.</li></ol><h4>Patrones comunes</h4><ol><li><b>El texto es el nuevo <em>payload</em>.</b> EchoLeak, Amazon Q y el log envenenado de la UD2 son el mismo ataque: datos no confiables tratados como instrucciones.</li><li><b>Las instrucciones no son controles.</b> «No toques producción» falló en Replit; protege que el agente no tenga la credencial.</li><li><b>La IA también se equivoca cuando ataca.</b> GTG-1002 inventaba hallazgos: la verificación humana sigue siendo el cuello de botella en ambos bandos.</li><li><b>Los IOC estáticos pierden valor.</b> Con código regenerado en cada ejecución, la detección tiene que ir a comportamiento.</li><li><b>El eslabón humano sigue siendo el primero.</b> Arup y Samsung no necesitaron ninguna vulnerabilidad técnica.</li></ol>"+(D.role==='profe'?"<div class=\"note profe-only\">"+ICON.q+"<div><span class=\"pbadge\">profe</span> <b>Notas para plantear los casos:</b><ul style=\"margin:6px 0 0\"><li><b>PromptLock</b>: presentarlo primero con el titular original («primer ransomware IA») y dejar que el alumnado descubra el origen académico al verificar. Es el mejor ejemplo de «matizado».</li><li><b>GTG-1002</b>: el informe de Anthropic es la fuente primaria; sirve como lectura guiada para mapear fases a ATT&amp;CK (UD3) y para hablar de atribución con niveles de confianza.</li><li><b>Casos ⚠️</b>: los CVE que circulan para el caso Hugging Face/OpenAI tienen una numeración que no he podido confirmar; si no aparecen en NVD, el grupo debe descartarlos. No revelar esto antes del ejercicio.</li><li><b>Caza de PromptLock</b>: no usar ninguna muestra real; basta un <span class=\"mono\">curl</span> o un script de PowerShell que haga la petición HTTP. La regla buena detecta el <em>proceso</em> y el <em>destino</em>, no un hash.</li><li>Revisar este bloque cada curso: los casos de 2026 pueden haberse confirmado, corregido o desmentido.</li></ul></div></div>":'')+'<div class="note warn">'+ICON.warn+'<div><b>Verificar al inicio de cada curso:</b> los casos de 2026 envejecen rápido. Antes de impartir, comprobar en la fuente primaria si se han confirmado o corregido.</div></div>'+"<p style=\"font-size:12.5px;color:var(--faint);margin-top:14px\"><b>Fuentes:</b> <a href=\"https://www.anthropic.com/news/disrupting-AI-espionage\" target=\"_blank\" rel=\"noopener\">Anthropic — campaña GTG-1002</a> · <a href=\"https://www-cdn.anthropic.com/b2a76c6f6992465c09a6f2fce282f6c0cea8c200.pdf\" target=\"_blank\" rel=\"noopener\">Anthropic — Threat Intelligence Report (GTG-2002)</a> · <a href=\"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2025-32711\" target=\"_blank\" rel=\"noopener\">Microsoft MSRC — CVE-2025-32711 (EchoLeak)</a> · <a href=\"https://thehackernews.com/2025/06/zero-click-ai-vulnerability-exposes.html\" target=\"_blank\" rel=\"noopener\">The Hacker News — EchoLeak</a> · <a href=\"https://www.constructionbriefing.com/news/arup-employee-falls-victim-to-us-25-million-deepfake-video-call-scam/8037338.article\" target=\"_blank\" rel=\"noopener\">Construction Briefing — declaración de Arup</a> · <a href=\"https://oecd.ai/en/incidents/2025-07-19-1eb1\" target=\"_blank\" rel=\"noopener\">OCDE AI Incidents — Replit</a> · <a href=\"https://www.techrepublic.com/article/news-amazon-q-data-wiping-prompt-security-hack/\" target=\"_blank\" rel=\"noopener\">TechRepublic — Amazon Q</a> · <a href=\"https://www.stepsecurity.io/blog/supply-chain-security-alert-popular-nx-build-system-package-compromised-with-data-stealing-malware\" target=\"_blank\" rel=\"noopener\">StepSecurity — s1ngularity</a> · <a href=\"https://blog.gitguardian.com/the-nx-s1ngularity-attack-inside-the-credential-leak/\" target=\"_blank\" rel=\"noopener\">GitGuardian — s1ngularity</a> · <a href=\"https://eset.com/us/about/newsroom/research/eset-discovers-promptlock-the-first-ai-powered-ransomware\" target=\"_blank\" rel=\"noopener\">ESET — PromptLock</a> · <a href=\"https://infosecurity-magazine.com/news/first-ai-powered-ransomware\" target=\"_blank\" rel=\"noopener\">Infosecurity Magazine — origen académico de PromptLock</a> · <a href=\"https://www.darkreading.com/application-security/ai-code-tools-widely-hallucinate-packages\" target=\"_blank\" rel=\"noopener\">Dark Reading — slopsquatting</a> · <a href=\"https://www.bangkokpost.com/life/tech/2562014/samsung-bans-staff-use-of-ai-over-data-leak\" target=\"_blank\" rel=\"noopener\">Reuters vía Bangkok Post — Samsung</a> · <a href=\"https://incidentdatabase.ai/\" target=\"_blank\" rel=\"noopener\">AI Incident Database (repertorio para ampliar)</a>.</p>";
 return s;}

function solBlock(html){return '<div class="sol profe-only"><div class="solh">'+ICON.fix+'Solución <span class="pbadge">profe</span></div>'+html+'</div>';}
function activityCard(a,color,uid){var d=el('details','act');d.id='act-'+a.n.replace('.','-');d.style.setProperty('--udc',color);
 var ia='';
 if(a.ia){ia+='<div class="ia"><div class="iah">'+ICON.ia+'Capa IA</div>';
  ia+='<span class="lbl" style="color:var(--ia)">Ruta de trabajo</span>'+list(a.ia.ruta);
  (a.ia.prompts||[]).forEach(function(p){ia+=codeBlock(p);});
  if(a.ia.risk)ia+='<div class="line risk"><b>Riesgo ·</b> '+a.ia.risk+'</div>';
  if(a.ia.ctrl)ia+='<div class="line ctrl"><b>Control ·</b> '+a.ia.ctrl+'</div>';
  if(a.ia.labId&&D.labtasks[a.ia.labId]){var L=D.labtasks[a.ia.labId];
   ia+='<div class="labia" style="margin-top:16px;border:1px dashed var(--border-strong);border-radius:9px;padding:2px 15px 14px;background:var(--surface-2)"><div class="lbl">Laboratorio integrado</div><h4>'+L.t+'</h4><p>'+L.escenario+'</p><div class="lbl">Pasos</div><ol>'+L.pasos.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ol><div class="deliver"><b>Entregable ·</b> '+L.entregable+'</div></div>';}
  ia+='</div>';}
 var fixes=(D.role==='profe'&&a.fixes)?('<div class="note fix profe-only">'+ICON.fix+'<div><span class="pbadge">profe</span> <b>Corregido respecto al material de partida:</b><ul style="margin:6px 0 0">'+a.fixes.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul></div></div>'):'';
 var q=(D.role==='profe'&&a.q)?('<div class="note profe-only" style="background:color-mix(in srgb,var(--ud5) 8%,var(--surface));border-color:color-mix(in srgb,var(--ud5) 30%,transparent)">'+ICON.q+'<div><span class="pbadge">profe</span> <b>Decisiones / notas docentes:</b><ul style="margin:6px 0 0">'+a.q.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul></div></div>'):'';
 var note=a.note?('<div class="note">'+ICON.info+'<div>'+a.note+'</div></div>'):'';
 d.innerHTML='<summary><span class="anum">'+a.n+'</span><span class="stit"><span class="t">'+a.t+'</span><span class="ca">'+a.ca+'</span></span><span class="chev">'+ICON.chev+'</span></summary>'
 +'<div class="body"><p>'+a.obj+'</p>'
 +'<span class="lbl">Entorno y herramientas</span><div class="chips">'+a.tools.map(function(t){return '<span class="chip">'+t+'</span>';}).join('')+'</div>'
 +'<span class="lbl">Tarea de aula (sin IA)</span>'+list(a.steps)
 +(a.code?codeBlock(a.code):'')
 +fixes
 +'<div class="deliver"><b>Entregable ·</b> '+a.deliver+'</div>'
 +'<p class="amp"><b>Ampliación ·</b> '+a.amp+'</p>'
 +(a.extra||'')
 +q+note+ia
 +((D.role==='profe'&&D.sols&&D.sols[uid]&&D.sols[uid].act[a.n])?solBlock(D.sols[uid].act[a.n]):'')
 +'</div>';
 return d;}

function unitSection(u){var s=el('section');s.id=u.id;s.style.setProperty('--udc',u.color);
 var av=u.aviso?('<div class="note warn">'+ICON.warn+'<div>'+u.aviso+'</div></div>'):'';
 var teoria=u.teoria?('<span class="lbl">Teoría de la unidad</span>'+u.teoria.map(function(t,i){return '<h4 id="teo-'+u.id+'-'+(i+1)+'">'+t.h+'</h4>'+t.html;}).join('')):'';
 var tareas='';
 if(u.tareas&&(D.role==='profe'||u.id==='ud1')){
  var ti=u.tareas.items.map(function(t){
   var peso=(t.peso&&t.peso!=='—')?' <span class="tpeso">'+t.peso+'</span>':'';
   var ts=(D.role==='profe'&&D.sols&&D.sols[u.id]&&D.sols[u.id].tar[t.n])?solBlock(D.sols[u.id].tar[t.n]):'';
   return '<div class="tarea" id="'+tarId(u,t)+'"><div class="tnum">'+t.n+'</div><div class="tbody"><div class="tt">'+t.t+peso+'</div><p class="ten">'+t.en+'</p><div class="tent"><b>Entregable ·</b> '+t.ent+'</div>'+ts+'</div></div>';
  }).join('');
  var nota=u.tareas.nota?('<div class="note">'+ICON.info+'<div>'+u.tareas.nota+'</div></div>'):'';
  tareas='<span class="lbl" style="margin-top:30px">Tareas entregables ('+u.tareas.items.length+')</span>'+nota+'<div class="tareas">'+ti+'</div>';
 }
 s.innerHTML='<div class="sec-head"><span class="tag" style="background:'+u.color+'">'+u.tag+'</span><h2>'+u.title+'</h2></div>'
 +'<p class="sec-meta">'+u.dur+' · '+u.peso+' · '+u.ra+' · Instrumentos '+u.inst+'</p>'
 +'<p class="lead">'+u.intro+'</p>'+av+teoria
 +'<span class="lbl" style="margin-top:26px">Actividades ('+u.acts.length+')</span><div class="acts"></div>'
 +tareas;
 var wrap=s.querySelector('.acts');u.acts.forEach(function(a){wrap.appendChild(activityCard(a,u.color,u.id));});
 return s;}

function tarId(u,t){return 'tar-'+u.id+'-'+t.n.replace('.','-');}
function detalleUnit(u){var B=(D.detalle||{})[u.id];if(!B)return null;if(D.role!=='profe'&&u.id!=='ud1')return null;
 var s=el('section','det');s.id='det-'+u.id;s.style.setProperty('--udc',u.color);
 var body=B.map(function(b,i){return '<h3 id="det-'+u.id+'-'+(i+1)+'">'+b.h+'</h3>'+b.html;}).join('');
 var prac='';var PR=(D.prac||{})[u.id];
 if(PR&&D.role==='profe'){prac='<div class="pracbox profe-only"><span class="lbl" style="margin-top:14px">Prácticas de aula <span class="pbadge">profe</span> · curso en Moodle</span>'
  +PR.map(function(g){return '<div class="pg">'+g[0]+'</div><ul>'+g[1].map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>';}).join('')
  +'<p class="amp" style="margin-top:12px">Catálogo de prácticas realmente impartidas (aula virtual del módulo). Sirven de repertorio para las actividades; adáptalas al laboratorio propio (Proxmox/Vagrant, TecnoMariña) y a la capa de IA de cada unidad.</p></div>';}
 s.innerHTML='<div class="sec-head"><span class="tag" style="background:'+u.color+'">'+u.tag+' · DET</span><h2>'+u.title+' — desarrollo</h2></div>'
 +'<p class="sec-meta">Teoría desarrollada de la unidad</p>'+body+prac;
 return s;}

function resumenUnit(u){var R=(D.resumenes||{})[u.id];if(!R)return null;
 var s=el('section','res');s.id='res-'+u.id;s.style.setProperty('--udc',u.color);
 var strip=function(h){return h.replace(/<[^>]+>/g,'');};
 var teo=(u.teoria||[]).map(function(t,i){return '<li><a href="#teo-'+u.id+'-'+(i+1)+'">'+t.h.replace(/^\d+\.\s*/,'')+'</a> — '+(R.teoria[i]||'')+'</li>';}).join('');
 var acts=u.acts.map(function(a){return '<tr><td><a href="#act-'+a.n.replace('.','-')+'">'+a.n+'</a></td><td>'+a.t+'</td><td class="num">'+a.ca+'</td><td>'+strip(a.deliver)+'</td></tr>';}).join('');
 var caDe={};R.ca.forEach(function(c){c[4].forEach(function(n){(caDe[n]=caDe[n]||[]).push(c[0]);});});
 var items=(u.tareas&&u.tareas.items)||[];
 var tars=items.map(function(t){var p=(t.peso&&t.peso!=='—')?t.peso:'—';return '<tr><td><a href="#'+tarId(u,t)+'">'+t.n+'</a></td><td>'+t.t+'</td><td class="num">'+p+'</td><td class="num">'+((caDe[t.n]||[]).join(', ')||'—')+'</td><td>'+strip(t.ent)+'</td></tr>';}).join('');
 var byN={};items.forEach(function(t){byN[t.n]=t;});
 var cas=R.ca.map(function(c){var l=c[4].map(function(n){return byN[n]?'<a href="#'+tarId(u,byN[n])+'">'+n+'</a>':n;}).join(' · ');return '<tr><td class="mono">'+c[0]+'</td><td>'+c[1]+'</td><td class="num">'+c[2]+'</td><td class="num">'+c[3]+' %</td><td>'+(l||'<span class="gap">solo con la actividad</span>')+'</td></tr>';}).join('');
 var claves=(D.role==='profe'&&R.claves)?('<div class="note profe-only" style="background:color-mix(in srgb,var(--ud5) 8%,var(--surface));border-color:color-mix(in srgb,var(--ud5) 30%,transparent)">'+ICON.q+'<div><span class="pbadge">profe</span> <b>Puntos de atención:</b><ul style="margin:6px 0 0">'+R.claves.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul></div></div>'):'';
 s.innerHTML='<div class="sec-head"><span class="tag" style="background:'+u.color+'">RES · '+u.tag+'</span><h2>Resumen de la '+u.tag+'</h2></div>'
 +'<p class="sec-meta">'+u.title+' · '+u.dur+' · '+u.peso+' · '+u.ra+' · '+u.inst+'</p>'
 +'<h3>Teoría a explicar</h3><ol class="teo">'+teo+'</ol>'
 +'<h3>Actividades de aula ('+u.acts.length+')</h3><div class="tbl-wrap"><table><thead><tr><th>Act.</th><th>Título</th><th>CA · horas</th><th>Producto</th></tr></thead><tbody>'+acts+'</tbody></table></div>'
 +(items.length?'<h3>Tareas de entrega ('+items.length+')</h3><div class="tbl-wrap"><table><thead><tr><th>Tarea</th><th>Título</th><th>Peso</th><th>CA</th><th>Entregable</th></tr></thead><tbody>'+tars+'</tbody></table></div>':'')
 +'<h3>Criterios de evaluación</h3><div class="tbl-wrap"><table><thead><tr><th>CA</th><th>Criterio</th><th>Inst.</th><th>Peso</th><th>Tareas que lo cubren</th></tr></thead><tbody>'+cas+'</tbody></table></div>'
 +claves;
 return s;}

function usoSection(){var s=el('section','profe-only');s.id='uso';s.setAttribute('data-ia','1');
 s.innerHTML='<div class="sec-head"><span class="tag" style="background:var(--attack)">AULA</span><h2>Cuando el problema es el uso <span class="pbadge">profe</span></h2></div>'
 +'<p class="sec-meta">Incidente transversal · mal uso de la IA por parte del alumnado</p>'
 +'<p class="lead">Va a ocurrir; conviene tratarlo como un incidente más, con procedimiento escrito.</p>'
 +'<h4>Señales</h4><ul><li>Entregas sin errores pero sin criterio.</li><li>Bitácora de prompts rellenada a posteriori.</li><li>El alumno no sabe explicar su propio trabajo.</li><li>Estructuras de texto idénticas entre grupos.</li></ul>'
 +'<h4>Procedimiento en cuatro pasos</h4><ol><li><b>Defensa oral de cinco minutos.</b> No se acusa: se pregunta. Resuelve el 90 % de los casos sin conflicto.</li><li><b>Reconducción, no sanción.</b> Se devuelve con una consigna concreta.</li><li><b>Rediseño de la tarea.</b> Los enunciados anclados al laboratorio propio (sus VM, sus IP, sus capturas) son casi inmunes.</li><li><b>Registro.</b> Se anota en la tabla de observación como evidencia del proceso.</li></ol>';
 return s;}

function resumenSection(){var s=el('section','profe-only');s.id='resumen';s.setAttribute('data-ia','1');
 var rows=D.resumen.map(function(r,i){return '<tr><td class="mono" style="color:'+D.units[i].color+';font-weight:600">'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td></tr>';}).join('');
 s.innerHTML='<div class="sec-head"><span class="tag" style="background:var(--ia)">MAPA</span><h2>Resumen operativo <span class="pbadge">profe</span></h2></div>'
 +'<p class="sec-meta">Una fila por unidad · incluye el fallo de IA a provocar</p>'
 +'<div class="tbl-wrap"><table><thead><tr><th>UD</th><th>Uso principal de la IA</th><th>Fallo a provocar</th><th>Producto de defensa</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
 return s;}

function evalSection(){var s=el('section');s.id='eval';
 var tiles=D.units.map(function(u){return '<div class="tile" style="--udc:'+u.color+'"><div class="k">'+u.tag+' · '+u.ra+'</div><div class="b">'+u.peso.replace(' %','%')+'</div><div class="d">'+u.inst+'</div></div>';}).join('');
 s.innerHTML='<div class="sec-head"><span class="tag" style="background:var(--accent)">EVAL</span><h2>Evaluación</h2></div>'
 +'<p class="sec-meta">Ponderación por unidad e instrumentos</p><div class="tiles">'+tiles+'</div>'
 +'<p class="lead">Instrumentos: <b>Lista de Cotexo (LC)</b> para la calidad del producto técnico y <b>Táboa de Observación (TO)</b> para el proceso en las VM. La <b>bitácora de prompts</b> es anexo obligatorio de todo trabajo con IA y se integra en ambos instrumentos.</p>';
 return s;}

function footer(){var f=el('footer');
 f.innerHTML='<p>Material didáctico propio del módulo <b>MP5021 · Incidentes de Ciberseguridade</b> (Curso de Especialización en Ciberseguridade en Contornos das TI), basado en la programación LOOIFP del IES Chan do Monte (Marín), curso 2026/2027, y en guías públicas de INCIBE-CERT y CCN-CERT.</p>'
 +'<p class="legal">Todas las herramientas ofensivas se usan <b>exclusivamente dentro de la red aislada del laboratorio</b> y sobre activos ficticios. OSINT y phishing solo contra objetivos de prueba propios, nunca contra terceros reales. Los títulos de las actividades se mantienen en gallego, tal como figuran en la programación oficial; el desarrollo está en castellano.</p>';
 return f;}

function buildNav(){var h='<li class="grp">Entorno</li>'
 +'<li><a href="#lab" class="udh" style="--udc:var(--accent)"><span class="n">LAB</span>El laboratorio</a></li>'
 +'<li><a href="#escenario" class="udh" style="--udc:var(--accent)"><span class="n">ESC</span>Escenario detallado</a></li>'
 +'<li data-ia="1"><a href="#ia" class="udh" style="--udc:var(--ia)"><span class="n">IA</span>Trabajar con IA</a></li>'
 +'<li class="grp">Resúmenes por unidad</li>';
 D.units.forEach(function(u){if(D.resumenes&&D.resumenes[u.id])h+='<li><a href="#res-'+u.id+'" class="udh" style="--udc:'+u.color+'"><span class="n">'+u.tag+'</span>Resumen de la '+u.tag+'</a></li>';});
 h+='<li class="grp">Unidades, actividades y tareas</li>';
 D.units.forEach(function(u){h+='<li><a href="#'+u.id+'" class="udh" style="--udc:'+u.color+'"><span class="n">'+u.tag+'</span>'+u.title+'</a></li>';
  u.acts.forEach(function(a){h+='<li class="sub"><a href="#act-'+a.n.replace('.','-')+'" class="subd" style="--udc:'+u.color+'"><span class="n">'+a.n+'</span>'+a.t+'</a></li>';});
  if(D.role==='profe'||u.id==='ud1'){((u.tareas&&u.tareas.items)||[]).forEach(function(t){h+='<li class="sub"><a href="#'+tarId(u,t)+'" style="--udc:'+u.color+'"><span class="n">T'+t.n+'</span>'+t.t+'</a></li>';});}});
 h+='<li class="grp">Cierre</li>';
 if(D.role==='profe'){h+='<li data-ia="1"><a href="#uso" class="udh" style="--udc:var(--attack)"><span class="n">AULA</span>Uso indebido de la IA</a></li>'
 +'<li data-ia="1"><a href="#resumen" class="udh" style="--udc:var(--ia)"><span class="n">MAPA</span>Resumen operativo</a></li>';}
 h+='<li><a href="#eval" class="udh" style="--udc:var(--accent)"><span class="n">EVAL</span>Evaluación</a></li>';
 $('#navList').innerHTML=h;}

var main=$('#main');
main.appendChild(hero());main.appendChild(labSection());main.appendChild(escenarioSection());main.appendChild(iaSection());
D.units.forEach(function(u){var r=resumenUnit(u);if(r)main.appendChild(r);var dt=detalleUnit(u);if(dt)main.appendChild(dt);main.appendChild(unitSection(u));});
if(D.role==='profe'){main.appendChild(usoSection());main.appendChild(resumenSection());}
main.appendChild(evalSection());main.appendChild(footer());
buildNav();
function openTarget(){var id=decodeURIComponent(location.hash.slice(1));if(!id)return;var e=document.getElementById(id);if(e&&e.tagName==='DETAILS')e.open=true;}
window.addEventListener('hashchange',openTarget);openTarget();
$('#bitaPre').textContent=D.bitacora;

/* interacciones */
document.addEventListener('click',function(e){var b=e.target.closest('.copy');if(!b)return;var pre=b.closest('.code').querySelector('pre');var txt=pre.innerText;(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){var o=b.textContent;b.textContent='copiado ✓';b.classList.add('ok');setTimeout(function(){b.textContent=o;b.classList.remove('ok');},1400);}).catch(function(){});});
(function(){var root=document.documentElement,tb=$('#themeBtn');tb.addEventListener('click',function(){var cur=root.getAttribute('data-theme');var dark=cur?cur==='dark':matchMedia('(prefers-color-scheme: dark)').matches;root.setAttribute('data-theme',dark?'light':'dark');try{localStorage.setItem('mp5021-theme',dark?'light':'dark');}catch(e){}});try{var t=localStorage.getItem('mp5021-theme');if(t)root.setAttribute('data-theme',t);}catch(e){}})();
(function(){var sw=$('#iaSwitch');function apply(on){document.body.classList.toggle('no-ia',!on);sw.setAttribute('aria-pressed',on?'true':'false');sw.querySelector('span:last-child').textContent=on?'Capa IA visible':'Capa IA oculta';}var on=true;try{on=localStorage.getItem('mp5021-ia')!=='0';}catch(e){}apply(on);sw.addEventListener('click',function(){on=!on;apply(on);try{localStorage.setItem('mp5021-ia',on?'1':'0');}catch(e){}});})();
(function(){var side=$('#side'),nt=$('#navToggle');if(nt)nt.addEventListener('click',function(){side.classList.toggle('open');});$('#navList').addEventListener('click',function(e){if(e.target.closest('a'))side.classList.remove('open');});})();
})();
</script>
