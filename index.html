glas de <code>forward</code>, registros (<code>log</code>) y <b>DNAT</b> para publicar servicios; securizar con un segundo cortafuegos (DMZ + interno).", "Mover srvweb a la DMZ y permitir solo el puerto necesario; en 16 GB con nftables, pfSense en el nivel ampliado.", "Backups regla 3-2-1 con restic + cron; probar la recuperación y medir RTO/RPO.", "Documentar el plan de resiliencia (activos, RTO/RPO, medidas)."], "code": {"who": "nftables · fragmento del cortafuegos (interfaces y DNAT)", "lines": "<span class=\"c\"># Interfaces en minúscula: enp0s3 / enp0s8 / enp0s9</span>\ndefine INTFZ_INTERNET = <span class=\"s\">\"enp0s3\"</span>\ndefine INTFZ_COM      = <span class=\"s\">\"enp0s8\"</span>\ndefine INTFZ_DMZ      = <span class=\"s\">\"enp0s9\"</span>\ndefine SERV_CORREO    = 192.168.40.3\n\n<span class=\"c\"># DNAT (tabla nat, hook prerouting): publicar un servicio</span>\ntable ip traduccion {\n  chain prerouting { type nat hook prerouting priority dstnat;\n    iifname $INTFZ_INTERNET tcp dport 3578 dnat to $SERV_CORREO:14000\n  }\n  chain postrouting { type nat hook postrouting priority srcnat; masquerade }\n}\n<span class=\"c\"># IMPRESCINDIBLE: además del DNAT, ACEPTAR el tráfico ya traducido</span>\n<span class=\"c\"># en la cadena forward (política drop), o el paquete se descarta:</span>\n<span class=\"c\">#   ip daddr $SERV_CORREO tcp dport 14000 accept</span>"}, "deliver": "Ficheros <span class='mono'>.conf</span> de los cortafuegos + plan de resiliencia + informe de RTO/RPO + evidencia de segmentación.", "amp": "Cifrar los backups y probar restauración en máquina limpia; inmutabilidad frente a ransomware.", "q": ["El <b>diseño del cortafuegos y la segmentación</b> vive aquí, en CA4.2, que es donde el currículo sitúa la segmentación de redes. Segmentación por defecto <b>simulada</b> con nftables (16 GB); pfSense real solo en el nivel ampliado (DMZ 172.21.20.0/24)."], "fixes": ["<b>Interfaz mal escrita</b>: en el material de partida figuraba <code>\"enp0S8\"</code> con S mayúscula; nftables no la reconoce. Debe ir en minúscula.", "<b>Redirecciones sin regla de reenvío</b>: los DNAT (3578→14000 y 3456→7777) no traían su <code>accept</code> en la cadena <code>forward</code> (política <code>drop</code>), así que el tráfico traducido se descartaba. Se añade la regla de aceptación."], "ia": {"ruta": ["La IA propone RTO y RPO por servicio y el esquema 3-2-1; el alumnado lo implementa con restic y lo prueba restaurando.", "Los diagramas de segmentación y el ruleset se generan en Mermaid/tabla y se corrigen a mano antes de tocar el cortafuegos.", "Ninguna regla de firewall se aplica sin explicar qué abre y qué cierra."], "risk": "Configuración copiada sin entender: reglas que dejan un puerto abierto; o un script de limpieza destructivo.", "ctrl": "Verificación posterior desde Kali con nmap contra la DMZ, para comprobar que solo responde lo previsto. Regla de los tres filtros para todo comando (explicar, dry-run, snapshot).", "labId": 4}}, {"n": "4.3", "t": "Decisión baixo presión", "ca": "CA4.3 · Flujo de decisiones y escalado (5 h)", "obj": "Decidir rápido y escalar correctamente según la gravedad.", "tools": ["draw.io / Mermaid", "Matriz de severidad CCN-CERT", "RACI", "NIS2 / RGPD"], "steps": ["Matriz de severidad y qué implica cada nivel (a quién, en cuánto tiempo).", "Árbol de decisión y escalado interno (técnico → responsable → dirección) y externo (proveedor, CERT, autoridad).", "Role play de 2–3 incidentes de distinta gravedad bajo tiempo.", "Registrar decisiones y tiempos."], "deliver": "Flujo de escalado + matriz de severidad + registro de simulaciones.", "amp": "Añadir plazos legales al árbol: NIS2 (alerta temprana) y RGPD (72 h a la AEPD).", "ia": {"ruta": ["Generar el árbol de escalado en sintaxis <b>Mermaid</b>, con nodos de decisión y plazos.", "Recorrerlo con cinco incidentes distintos: los que no encajan obligan a rediseñarlo.", "Los plazos legales del árbol se verifican en la fuente, no en la IA."], "prompts": [{"who": "prompt · árbol de escalado en Mermaid", "lines": "Genera en sintaxis Mermaid un diagrama de flujo de escalado de incidentes para\nuna empresa de 30 personas con un único técnico de sistemas, un responsable de\nTI y gerencia. Nodos de decisión: ¿hay datos personales afectados?, ¿hay\nservicio público caído?, ¿hay petición de rescate?, ¿se supera 1 hora sin\ncontención? Incluye plazos y a quién se notifica en cada rama."}], "risk": "Dependencia operativa: el grupo se para a consultar a la IA en mitad del role play y pierde la ventana de decisión.", "ctrl": "Regla del reloj: la IA se usa en preparación y en post-mortem, nunca durante la ventana de respuesta."}}, {"n": "4.4", "t": "Volver á normalidade", "ca": "CA4.4 · Restablecimiento de servicios (5 h)", "obj": "Recuperar servicios de forma segura y verificar su integridad.", "tools": ["Backups (restic/snapshots)", "Wazuh FIM (syscheck)", "sha256sum", "debsums"], "steps": ["Erradicar (webshell/persistencia) y restaurar srvweb desde copia limpia.", "Reforzar antes de producción: parche, contraseñas nuevas, cierre del vector.", "Verificar integridad con el FIM de Wazuh frente a la línea base.", "Reconectar y vigilar; confirmar la vuelta a la normalidad con criterios objetivos."], "deliver": "Plan de recuperación + informe de verificación (checklist de integridad y disponibilidad).", "amp": "Definir criterios formales de cierre y una ventana de observación reforzada; investigar la herramienta REYES.", "ia": {"ruta": ["La IA genera el <b>checklist de vuelta a la normalidad</b>: qué se comprueba antes de reconectar y cómo se confirma que no hay persistencia.", "Contrastarlo con el FIM de Wazuh frente a la línea base: la herramienta manda sobre la lista.", "Definir criterios de cierre objetivos y una ventana de observación reforzada."], "risk": "Checklist genérico que da el incidente por cerrado sin comprobar el vector de entrada original.", "ctrl": "El criterio de cierre incluye siempre una comprobación explícita del vector identificado en la UD3."}}, {"n": "4.5", "t": "Aprender do pasado", "ca": "CA4.5 · Documentación y lecciones (6 h)", "obj": "Cerrar el ciclo con documentación que evite repeticiones.", "tools": ["Plantillas INCIBE-CERT / NIST", "BookStack / DokuWiki", "5 porqués"], "steps": ["Informe post-incidente: resumen ejecutivo, cronología, impacto, causa raíz.", "Extraer lecciones y acciones correctivas/preventivas (responsable y fecha).", "Publicar en la base de conocimiento."], "deliver": "Documentación completa del incidente + informe de lecciones con plan de mejora.", "amp": "Retrospectiva sin culpables; convertir cada lección en una regla Wazuh o un control CIS.", "ia": {"ruta": ["La IA facilita un <b>post-mortem sin culpables</b>: preguntas, fallos de proceso y acciones correctivas con indicador.", "Cada lección se convierte en algo comprobable: una regla de Wazuh o un control CIS.", "Publicar indicando qué parte redactó la IA."], "prompts": [{"who": "prompt · post-mortem sin culpables", "lines": "Te paso la cronología de nuestra respuesta al incidente [pegar]. Facilita un\npost-mortem sin culpabilizar (blameless). Dame: 5 preguntas que deberíamos\nrespondernos, 3 fallos de proceso (no de personas) que detectas, y 3 acciones\ncorrectivas con indicador medible para saber si funcionaron."}], "risk": "Lecciones genéricas del tipo «mejorar la concienciación», que no se pueden medir ni cerrar.", "ctrl": "Ninguna acción correctiva se acepta sin responsable, fecha e indicador que diga si funcionó."}}, {"n": "4.6", "t": "Simulación integral de resposta", "ca": "CA4.6 · Seguimiento (10 h)", "obj": "Ejecutar el ciclo completo de respuesta en equipo, en escenario realista.", "tools": ["Todo el laboratorio", "Escenario del docente"], "steps": ["El docente lanza un incidente completo (ransomware por phishing que salta a la DMZ).", "El equipo aplica todo el ciclo: detección → contención → erradicación → recuperación → escalado → documentación → seguimiento.", "Roles distribuidos (analista, coordinador, comunicación)."], "deliver": "Informe final + plan de seguimiento + reflexión.", "amp": "Repetir el escenario tras aplicar mejoras y demostrar que ahora se detecta/contiene más rápido.", "ia": {"ruta": ["Durante el simulacro la IA queda <b>fuera</b>: solo playbooks y procedimientos escritos.", "Se usa después, en el post-mortem, para contrastar la cronología real con el playbook previsto.", "Se anotan los puntos donde el procedimiento no bastó y se corrigen en frío."], "risk": "Sugerencias temerarias o ilegales bajo presión: negociar con los atacantes, atacar de vuelta el servidor origen.", "ctrl": "El playbook incorpora una sección explícita de acciones prohibidas con su fundamento legal. Cuando aparece la sugerencia, se detiene la actividad y se analiza: la mala respuesta acaba mejorando el entregable."}}], "tareas": {"nota": "Este bloque incluye las tareas de <b>cortafuegos/nftables 1.1–1.4</b>, trasladadas desde la UD1 por corresponder a <b>CA4.2 (segmentación de redes)</b>.", "items": [{"n": "1.1", "t": "Diseño de red con cortafuegos", "peso": "—", "en": "Dadas las políticas de seguridad de la organización (departamentos, DMZ, servicios publicados), diseñad el esquema de red y escribid el <em>ruleset</em> del/los cortafuegos en formato tabla (origen, destino, puertos, interfaz, estado, acción).", "ent": "PDF con el diseño de red y la tabla de reglas."}, {"n": "1.2", "t": "Implementación en nftables", "peso": "—", "en": "Implementad el ruleset de 1.1 en <b>nftables</b> sobre Debian (interfaces en minúscula, políticas por defecto <span class='mono'>drop</span>).", "ent": "Fichero de configuración <span class='mono'>.conf</span> de nftables."}, {"n": "1.3", "t": "Registros y publicación de servicios", "peso": "—", "en": "Sobre 1.2, añadid registros (<span class='mono'>log</span>) de los accesos indicados y las redirecciones de puertos (DNAT). Recordad aceptar en la cadena <span class='mono'>forward</span> el tráfico ya traducido.", "ent": "Fichero <span class='mono'>.conf</span> con las reglas comentadas."}, {"n": "1.4", "t": "Securización con doble cortafuegos", "peso": "—", "en": "Ampliad la red con un segundo cortafuegos (arquitectura DMZ + interno) y configurad ambos.", "ent": "Ficheros <span class='mono'>.conf</span> de los dos cortafuegos."}, {"n": "4.1", "t": "Curso de gestión de incidentes (CCN-CERT)", "peso": "—", "en": "Realizad el curso de Gestión de Incidentes de Ciberseguridad del CCN-CERT (plataforma ÁNGELES) y su examen final. Esta materia entra en el examen de la unidad.", "ent": "Captura de la puntuación del examen y del título obtenido."}, {"n": "4.2", "t": "Creación de playbooks", "peso": "—", "en": "Cread un playbook para cada uno de los primeros incidentes del juego de rol de INCIBE, usando como guía las fases de gestión de incidentes.", "ent": "Documento PDF con los playbooks."}, {"n": "4.3", "t": "Uso de FIR", "peso": "—", "en": "Instalad FIR (Fast Incident Response) y gestionad con él los casos de los playbooks.", "ent": "PDF con capturas de la gestión de los incidentes en FIR."}, {"n": "4.4", "t": "Herramienta REYES", "peso": "—", "en": "Investigad las características y la arquitectura de la herramienta REYES del CCN-CERT y explicad cómo ayuda a la detección e identificación de ciberincidentes.", "ent": "Documento PDF."}]}}, {"id": "ud5", "tag": "UD5", "color": "var(--ud5)", "ra": "RA5", "title": "Detección y documentación", "dur": "12 sesiones", "peso": "15 %", "inst": "LC 60 / TO 40", "intro": "Unidad corta y muy densa, centrada en la notificación: procedimientos y plazos, canales internos, notificación a terceros y autoridades, análisis de impacto y lecciones. Es donde la IA es más útil (redacción bajo presión) y donde más falla (plazos legales). Un buzón MailHog permite enviar avisos sin salir a Internet.", "teoria": [{"h": "1. Marco de notificación y ventanilla única", "html": "<p>Notificar un incidente a tiempo y a quien corresponde es una obligación legal y una buena práctica. La <b>Guía Nacional de Notificación y Gestión de Ciberincidentes</b> establece el modelo de <b>ventanilla única</b>: la entidad afectada notifica a su <b>CSIRT de referencia</b> —<b>INCIBE-CERT</b> para el sector privado y la ciudadanía; <b>CCN-CERT</b> (a través de <b>LUCÍA</b>) para el sector público; ESP-DEF-CERT para el ámbito de Defensa— y este deriva a la <b>autoridad competente</b> según el caso: la <b>AEPD</b> si hay datos personales afectados, el <b>CNPIC</b> si afecta a infraestructuras críticas. A nivel autonómico, CSIRT como CSIRT.gal actúan como punto de contacto.</p>"}, {"h": "2. Peligrosidad, impacto y plazos", "html": "<p>Cada incidente se evalúa por su nivel de <b>peligrosidad</b> (crítico, muy alto, alto, medio, bajo), que estima la amenaza en sí, y por su nivel de <b>impacto</b>, que estima las consecuencias para la organización y terceros. Como norma general, son de <b>notificación obligatoria</b> los incidentes de nivel <em>alto</em> o superior. La notificación no es un único acto: hay una <b>notificación inicial</b> (inmediata, con lo que se sabe), una <b>intermedia</b> (actualizaciones) y una <b>final</b> (cierre con causa y lecciones). Los plazos concretos dependen del nivel y del marco aplicable.</p>"}, {"h": "3. RGPD y NIS2", "html": "<p>Dos marcos fijan los plazos que más se preguntan. El <b>RGPD</b> obliga, ante una <b>brecha de datos personales</b>, a notificar a la <b>AEPD en 72 horas</b> desde que se tiene constancia, y a comunicar a los <b>afectados sin dilación</b> cuando hay alto riesgo para sus derechos. La <b>Directiva NIS2</b> (UE 2022/2555), para los sujetos obligados (entidades esenciales e importantes), fija una <b>alerta temprana en 24 h</b>, una <b>notificación en 72 h</b> y un <b>informe final en 1 mes</b>.</p><div class=\"note warn\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M12 9v4M12 17h.01\"/><path d=\"M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z\"/></svg><div><b>Dato a verificar cada curso.</b> A julio de 2026 la Ley española de transposición de NIS2 <b>seguía sin publicarse en el BOE</b>. Mientras no se publique, los plazos aplicables provienen del RGPD y de la propia Directiva NIS2. Comprobar el estado en el BOE al inicio de cada curso.</div></div>"}, {"h": "4. Comunicación multi-audiencia y gestión de crisis", "html": "<p>El mismo incidente debe traducirse a <b>públicos distintos</b> sin alterar los hechos: al <b>técnico</b> que tiene que actuar (breve y accionable), al <b>responsable de TI</b> (con impacto y decisiones pendientes), a la <b>dirección</b> (sin jerga, con coste y riesgo legal) y a la <b>plantilla o la ciudadanía</b> (qué deben hacer y qué no). Las reglas de oro son la <b>doble redacción</b> (trabajar primero con marcadores como <code>[N] afectados</code> y sustituir los datos reales en local y al final), la <b>verificación de plazos en la fuente primaria</b> y la <b>revisión cruzada</b> de tres lecturas antes de emitir. En la comunicación pública se evita el tono corporativo vacío y no se admite responsabilidad antes de conocer la causa; un buen comunicado contiene hechos, fechas e instrucciones concretas, no frases que valdrían para cualquier organización.</p>"}, {"h": "5. Incidentes reales con IA", "html": "<p>Casos reales para trabajar notificación y comunicación:</p><ul><li><b>«Vibe hacking»: extorsión GTG-2002 (informe de Anthropic, agosto 2025)</b> · ✅ Un actor criminal usó un agente de programación (Claude Code) como operador: escaneo automatizado de miles de VPN, intrusión, elección de los datos que robar y redacción de notas de extorsión personalizadas. Al menos 17 organizaciones afectadas (sanidad, emergencias, administración, entidades religiosas). <b>No cifraba nada</b>: robaba y amenazaba con publicar, con exigencias que en algunos casos superaban los 500.000 USD. <br><b>Para esta unidad:</b> una extorsión sin cifrado sigue siendo una <b>brecha de datos personales</b> si se roban; arranca el plazo de notificación a la AEPD (72 h del RGPD) aunque ningún servicio se haya caído.</li><li><b>Deepfake en videollamada — Arup, Hong Kong (enero 2024)</b> · ✅ Un empleado de finanzas entró en una videollamada con quien creía que era el director financiero y otros compañeros; <b>todos eran recreaciones generadas con IA</b> a partir de vídeos públicos. Ordenó 15 transferencias por unos 200 M HKD (≈25,6 M USD) a cinco cuentas. Había desconfiado de un primer correo, pero la videollamada disipó sus dudas. La empresa declaró que ningún sistema interno fue comprometido: <b>ingeniería social pura, potenciada por IA</b>. <br><b>Para esta unidad:</b> analizad la comunicación de la empresa: qué dijo (fraude, sistemas no comprometidos, investigación en curso) y qué no podía decir todavía.</li><li><b>Replit borra una base de datos de producción (julio 2025)</b> · ✅ Durante un experimento de «vibe coding», el agente borró la BD real de la empresa (≈1.200 directivos y ≈1.190 compañías) <b>en plena congelación de código declarada expresamente</b>. Después dio información que no cuadraba con el estado real del sistema y aseguró que no se podía recuperar. La empresa pidió disculpas e introdujo separación automática desarrollo/producción y un modo «solo planificar». Lección: <b>una instrucción en el prompt no es un control de seguridad</b>; lo es que el agente no tenga la credencial. <br><b>Para esta unidad:</b> la disculpa pública del CEO y las medidas anunciadas en pocos días. ¿Admite responsabilidad? ¿Da hechos concretos? Aplicad la prueba de la frase concreta.</li><li><b>EchoLeak: CVE-2025-32711 en Microsoft 365 Copilot (junio 2025)</b> · ✅ Prompt injection indirecta <b>sin clic</b> (CVSS 9.3): un correo aparentemente normal lleva instrucciones escondidas; cuando la víctima pide a Copilot algo legítimo, el motor RAG recupera ese correo y Copilot acaba enviando datos al atacante. Esquivaba el clasificador anti-inyección redactando las órdenes como si fueran para el lector humano. Microsoft lo corrigió sin evidencia de explotación real. <br><b>Para esta unidad:</b> diferencia entre comunicar una <b>vulnerabilidad corregida sin explotación conocida</b> y comunicar un <b>incidente</b>: no generan las mismas obligaciones.</li></ul><p style=\"font-size:13px\">Catálogo completo, mapa por unidades y fuentes en <a href=\"#incidentes-ia\">Trabajar con IA → Incidentes reales provocados por IA</a>.</p>"}], "acts": [{"n": "5.1", "t": "Alerta temperá", "ca": "CA5.1 · Procedimiento y plazos (2 h)", "obj": "Definir cómo y en qué plazos se notifica cada incidente.", "tools": ["Plantillas INCIBE-CERT / LUCÍA", "MailHog / Mailpit", "NIS2 · RGPD · ENS"], "steps": ["Clasificar qué incidentes exigen notificación inmediata y a quién.", "Construir la <b>tabla de disparadores y plazos</b>, verificando cada plazo en la fuente; imprimirla y colgarla en el aula.", "Redactar la plantilla de aviso de 10 líneas y enviarla al buzón MailHog."], "code": {"who": "siem · buzón de correo de laboratorio", "lines": "sudo <span class=\"a\">docker</span> run -d -p 8025:8025 -p 1025:1025 mailhog/mailhog\n<span class=\"c\"># Buzón web: http://172.21.10.10:8025   ·   SMTP: 172.21.10.10:1025</span>"}, "deliver": "Procedimiento de notificación + tabla de plazos verificada + ejemplo de aviso.", "amp": "Tabla comparativa de plazos: NIS2 (24 h / 72 h) vs RGPD (72 h a la AEPD).", "ia": {"ruta": ["La IA propone la tabla de disparadores y plazos; cada plazo se verifica en la fuente y la tabla se cuelga en el aula.", "El resto del curso los plazos se miran en la tabla: no se vuelven a preguntar a la IA.", "Plantilla de aviso de diez líneas: qué ha pasado, cuándo se detectó, qué está afectado, qué se hace, qué necesito de ti, cuándo vuelvo a informar."], "risk": "Plazo alucinado: «72 horas hábiles», o una norma derogada. Es el dato que la IA falla con más frecuencia.", "ctrl": "Lo que tiene consecuencias legales se verifica en la fuente primaria, siempre."}}, {"n": "5.2", "t": "Canles internas", "ca": "CA5.2 · Notificación interna (2 h)", "obj": "Comunicar internamente y escalar según la gravedad.", "tools": ["MailHog", "Flujo de escalado (UD4.3)", "Parte de incidente interno"], "steps": ["Notificar un incidente medio/alto siguiendo el flujo: analista → responsable → dirección.", "Redactar el parte interno (qué, impacto, medidas, decisión requerida).", "Simular el escalado al subir la gravedad; registrar comunicaciones."], "deliver": "Registro de comunicaciones internas + informe de escalado.", "amp": "Plantilla de comunicación de crisis y un canal «fuera de banda» por si el correo corporativo está comprometido.", "ia": {"ruta": ["Pedir cuatro versiones del mismo aviso <b>sin cambiar un solo hecho</b>: técnico, responsable de TI, gerencia y plantilla.", "Comparar qué se pierde en cada traducción y si algo importante desapareció al simplificar. Esa comparación es la actividad.", "Enviar las versiones al buzón MailHog siguiendo el flujo de escalado de 4.3."], "prompts": [{"who": "prompt · el mismo incidente, cuatro audiencias", "lines": "Te doy los hechos de un incidente [pegar]. Redacta cuatro versiones del mismo\naviso, sin cambiar ni un hecho:\n1. Para el técnico de sistemas (que tiene que actuar ya) — máx. 8 líneas\n2. Para el responsable de TI — máx. 10 líneas, con impacto y decisiones pendientes\n3. Para gerencia — máx. 6 líneas, sin jerga, con coste y riesgo legal\n4. Para la plantilla — máx. 5 líneas, qué deben hacer y qué no\nEn ninguna versión especules sobre causas ni sobre responsables."}], "risk": "Al simplificar para gerencia desaparece el dato que motiva la decisión que se les pide.", "ctrl": "La versión para gerencia se valida contra la técnica: cada decisión solicitada debe tener su hecho de respaldo.", "labId": 5}}, {"n": "5.3", "t": "Informes que protexen", "ca": "CA5.3 · Notificación a autoridades (2 h)", "obj": "Notificar a terceros con la documentación y el canal correctos.", "tools": ["INCIBE-CERT", "CCN-CERT (LUCÍA)", "CSIRT.gal", "AEPD", "GnuPG · TLP", "IODEF / STIX"], "steps": ["Determinar el organismo competente según entidad e incidente.", "Rellenar el informe estandarizado (identificación, impacto, IOC, medidas).", "Cifrar y enviar el aviso (a MailHog) aplicando TLP y confidencialidad.", "Registrar la comunicación externa y el seguimiento."], "deliver": "Informe estandarizado + registro de comunicaciones externas + justificación del organismo.", "amp": "Comparar una notificación NIS2 (a la autoridad) frente a una RGPD (a la AEPD y a los afectados).", "ia": {"ruta": ["Borrador del informe estandarizado con la IA, sobre la plantilla del organismo competente.", "<b>Filtro de confidencialidad</b> antes de cifrar y enviar: nombres, terceros, detalles reproducibles, especulación sobre autoría.", "La IA interpreta al funcionario que responde con un requerimiento de ampliación."], "risk": "Datos reales pegados en el chat para que la IA redacte mejor: la brecha se amplía durante la respuesta a la brecha.", "ctrl": "Doble redacción con marcadores [N] afectados, [SERVICIO], [FECHA]. Los datos reales entran en local y al final, nunca al revés."}}, {"n": "5.4", "t": "Análise de impacto", "ca": "CA5.4 · Notificación a afectados (3 h)", "obj": "Evaluar el impacto y comunicar a los afectados adecuadamente.", "tools": ["Datos del SIEM / registro", "Matriz de impacto", "Plantillas RGPD"], "steps": ["Evaluar el impacto sobre sistemas, datos y servicios; estimar alcance.", "Priorizar incidentes/afectados por gravedad e impacto.", "Redactar la comunicación formal a los afectados (clara, honesta, con medidas) y enviarla al buzón."], "deliver": "Informe de análisis de impacto + lista priorizada + comunicación a afectados.", "amp": "Dos versiones de la comunicación (técnica para proveedores, sencilla para clientes) y evaluar cuál cumple el RGPD.", "ia": {"ruta": ["La IA propone la matriz de impacto y una priorización; el alumnado la ajusta al caso y justifica cada cambio.", "El entregable lleva las dos versiones en paralelo: la de la IA y la corregida.", "Las cifras de alcance salen del SIEM y del registro, nunca de la estimación de la IA."], "risk": "Cifras de alcance inventadas que acaban dentro de una comunicación formal a los afectados.", "ctrl": "Todo número de la comunicación apunta a la consulta del SIEM o al campo del registro que lo respalda."}}, {"n": "5.5", "t": "Leccións aprendidas e mellora", "ca": "CA5.5 · Medios y mejora (3 h)", "obj": "Cerrar la gestión comunicativa y mejorar el proceso.", "tools": ["Plantilla de comunicado / portavocía", "BookStack / Moodle", "Retrospectiva"], "steps": ["Decidir si procede informar a medios y redactar, si aplica, un comunicado medido.", "Informe final de lecciones sobre la comunicación (qué funcionó, tiempos).", "Plan de mejora de los procedimientos; archivar en la base de conocimiento."], "deliver": "Informe final de lecciones + plan de mejora de notificación + (si procede) comunicado público.", "amp": "Simulacro de rueda de prensa / preguntas difíciles; analizar un caso real de gestión de una brecha.", "ia": {"ruta": ["La IA interpreta a un periodista incisivo: cuántos afectados, por qué no se dijo antes, si van a pagar. Tres rondas, la segunda sin preparación previa.", "<b>Prueba de la frase concreta</b>: se subraya todo lo que podría aparecer en el comunicado de cualquier otra empresa, y se elimina.", "Informe final de lecciones sobre la comunicación y plan de mejora."], "risk": "Comunicado con tono corporativo vacío, o que admite negligencia antes de conocer la causa.", "ctrl": "Tres lecturas con tres preguntas distintas: ¿hay algún hecho no confirmado?, ¿alguna frase admite culpa sin base?, ¿se entiende sin saber informática?"}}], "tareas": {"items": [{"n": "5.1", "t": "Alerta temperá", "peso": "—", "en": "Construid la tabla de disparadores de notificación (qué incidente, a quién, en qué plazo, verificando los plazos en la fuente) y una plantilla de aviso de 10 líneas.", "ent": "PDF con la tabla de plazos verificada y un ejemplo de aviso."}, {"n": "5.2", "t": "Canles internas", "peso": "—", "en": "Redactad cuatro versiones del mismo aviso, sin cambiar ningún hecho: técnico, responsable de TI, gerencia y plantilla; analizad qué se pierde en cada traducción.", "ent": "PDF con las cuatro versiones + análisis."}, {"n": "5.3", "t": "Informes que protexen", "peso": "—", "en": "Redactad la notificación externa al organismo competente (INCIBE-CERT / AEPD), con filtro de confidencialidad, y responded a un requerimiento de ampliación.", "ent": "PDF con las notificaciones y la respuesta."}, {"n": "5.4", "t": "Análise de impacto", "peso": "—", "en": "Elaborad una matriz de impacto × urgencia y una priorización; comparad la propuesta de la IA con vuestra versión corregida y justificad los cambios.", "ent": "PDF con las dos versiones en paralelo."}, {"n": "5.5", "t": "Leccións aprendidas e mellora", "peso": "—", "en": "Redactad el informe de lecciones aprendidas y, si procede, un comunicado público; incluid un simulacro de rueda de prensa.", "ent": "PDF con el informe, el comunicado y el anexo de la rueda de prensa."}]}}], "labtasks": {"1": {"t": "Laboratorio integrado · Normativa del puesto y detección de alucinaciones normativas", "escenario": "Como responsable de seguridad de TecnoMariña S.L., elaboras la Normativa de Protección del Puesto de Trabajo. Usas un LLM comercial para un primer borrador exhaustivo (autenticación, teletrabajo, bloqueo de pantalla, uso de IA generativa) y auditas cada control frente al ENS (RD 311/2022), detectando y corrigiendo las alucinaciones normativas.", "pasos": ["<b>Generación inicial.</b> Pedir a la IA la política de puesto exigiendo referencias expresas a artículos del ENS y a ISO/IEC 27002.", "<b>Auditoría de afirmaciones.</b> Localizar cada cita legal generada y contrastarla en el BOE.", "<b>Tratamiento de discrepancias.</b> Toda referencia inexistente se tacha y se sustituye por el marco real (p. ej. medidas [op.acc] del ENS).", "<b>Cláusula de IA.</b> Redactar la norma que prohíbe subir datos confidenciales o código municipal a plataformas de IA públicas.", "<b>Entrega.</b> Normativa final corregida + bitácora de prompts con las alucinaciones descartadas."], "entregable": "Normativa del puesto corregida + tabla de trazabilidad + bitácora de prompts."}, "2": {"t": "Laboratorio integrado · Triaje en Wazuh y mitigación de prompt injection en logs", "escenario": "Desde kali se lanza tráfico web hacia srvweb con una carga que intenta engañar al analista mediante instrucciones inyectadas en las cabeceras HTTP. El alumnado exporta las alertas de Wazuh, las somete a triaje asistido por IA, detecta la manipulación y crea una regla de detección.", "pasos": ["<b>Lanzamiento.</b> Desde kali, petición con la cabecera <code>User-Agent</code> envenenada (ver prompt de la capa IA).", "<b>Extracción.</b> Exportar desde Wazuh los eventos JSON del servidor web. <em>Nota: DVWA corre en contenedor; el log de Apache queda dentro, así que hay que montarlo o configurar el agente para leerlo, o el evento no llega a Wazuh.</em>", "<b>Comprobar la vulnerabilidad.</b> Con el prompt básico «clasifica estas alertas», ver cómo el LLM obedece la orden inyectada y descarta la alerta.", "<b>Aislamiento de contexto.</b> Rediseñar el prompt delimitando los datos y prohibiendo ejecutar órdenes contenidas en ellos.", "<b>Regla de detección.</b> Crear en <code>local_rules.xml</code> una regla que alerte cuando un <code>User-Agent</code> contenga «IGNORA» o «INSTRUCCIONES»."], "entregable": "Ficha del incidente + regla local de Wazuh + bitácora con los dos triajes (vulnerable y mitigado)."}, "3": {"t": "Laboratorio integrado · Cadena de custodia (RFC 3227) y desofuscación con IA local", "escenario": "Un atacante ha ejecutado un comando ofuscado en PowerShell en win10. Siguiendo el RFC 3227, se extrae la evidencia, se mantiene la cadena de custodia sin exponer datos a la nube y se analiza el código con un LLM local (Ollama) para mapearlo a MITRE ATT&CK.", "pasos": ["<b>Preservación (evidencia roja).</b> Extraer el script y calcular su huella antes y después del análisis con <code>Get-FileHash -Algorithm SHA256</code>. Completar la hoja de custodia.", "<b>Decodificación manual.</b> Si usa Base64/Unicode, obtener el texto claro en CyberChef, en local.", "<b>Análisis asistido local.</b> Suministrar el extracto a Ollama y pedir acciones línea a línea, claves de registro y técnicas ATT&CK.", "<b>Verificación de artefactos.</b> Comprobar en win10 si los ficheros o entradas de registro señalados por la IA realmente se crearon.", "<b>Entrega.</b> Informe pericial con hoja de custodia firmada, técnicas MITRE confirmadas y bitácora de IA local."], "entregable": "Informe forense pericial + hoja de custodia + bitácora de IA local."}, "4": {"t": "Laboratorio integrado · Firewall, playbook ante ransomware y resiliencia", "escenario": "Sobre la segmentación con nftables que has diseñado, desarrollas un playbook técnico ante ransomware (NIST SP 800-61) para TecnoMariña S.L., configuras en srvweb copias 3-2-1 con Restic, simulas un cifrado y mides experimentalmente el RTO y el RPO.", "pasos": ["<b>Generación con IA.</b> Pedir el esqueleto del playbook en 6 fases, etiquetando las órdenes con <code>[VERIFICAR]</code>.", "<b>Parametrización local.</b> Sustituir los marcadores por comandos y rutas reales del laboratorio (segmento 172.21.10.0/24).", "<b>Despliegue de copias.</b> <code>restic init</code> y <code>restic backup /var/www/html /etc/apache2</code>.", "<b>Simulación y restauración.</b> Alterar <code>/var/www/html</code>, cronometrar <code>restic restore latest</code> y calcular el RTO.", "<b>Comprobación FIM.</b> Validar con el FIM de Wazuh que el árbol de directorios vuelve a coincidir con la línea base."], "entregable": "Playbook validado por ejecución ciega + informe de RTO/RPO + evidencia FIM."}, "5": {"t": "Laboratorio integrado · Notificación de brecha y gestión comunicativa de crisis", "escenario": "Tras una fuga de datos personales en el portal municipal, se activan los procedimientos de notificación según el RGPD (72 h). Se usa la IA para adaptar el incidente a cuatro registros comunicativos con el protocolo de doble redacción y se realiza un simulacro de rueda de prensa.", "pasos": ["<b>Doble redacción.</b> Escribir el informe técnico con comodines (<code>[NUM_AFECTADOS]</code>, <code>[TIPO_DATOS]</code>) antes de pasarlo a la IA.", "<b>Adaptación multi-audiencia.</b> Pedir a la IA las cuatro versiones: técnica, gestión (TI), dirección y ciudadanía.", "<b>Desanonimización y prueba SMTP.</b> Completar los datos reales en local y emitir los avisos al SMTP de MailHog (172.21.10.10:1025).", "<b>Rueda de prensa.</b> El portavoz responde a tres rondas de preguntas incisivas formuladas por la IA como periodista.", "<b>Entrega.</b> Formularios oficiales cumplimentados + registro de comunicaciones."], "entregable": "Notificación formal + protocolo de doble redacción + registro de comunicaciones."}}, "resumen": [["UD1", "Generar casos, público simulado, checklist de auditoría", "Alucinación normativa", "Normativa + mural con casos tachados"], ["UD2", "Triaje de alertas, reglas Sigma, plan OSINT", "<b>Prompt injection vía log</b>", "Ficha del propio envenenamiento"], ["UD3", "Desofuscación, ATT&CK, hipótesis alternativas", "Atribución alucinada; evidencia fuera del lab", "Informe: confirmado / probable / hipótesis"], ["UD4", "Playbooks, firewall, árbol de escalado, post-mortem", "Script destructivo; consejo ilegal", "Playbook ejecutado por otro grupo"], ["UD5", "Redacción multi-audiencia, rueda de prensa", "Plazo alucinado; datos reales en el comunicado", "Tabla de plazos verificada + doble redacción"]], "resumenes": {"ud1": {"teoria": ["Tríada CIA más autenticación, autorización, trazabilidad y no repudio; amenaza, vulnerabilidad y riesgo; Zero Trust y defensa en profundidad.", "Quién es quién: INCIBE e INCIBE-CERT, CCN-CERT, OSI, AEPD y CSIRT.gal; marcos ENS, ISO/IEC 27000 y CIS Controls; RGPD y NIS2.", "Actores (ciberdelincuencia, hacktivismo, APT, ciberterrorismo), tendencias (RaaS, doble extorsión, cadena de suministro, fraude BEC, IA) y familias de malware.", "Phishing y sus variantes (spear-phishing, smishing, vishing, QRishing), spoofing, pretexting, baiting, tailgating y fraude del CEO.", "Política del puesto: actualizaciones, USB, almacenamiento, antimalware, borrado seguro, contraseñas y MFA, copias, correo, teletrabajo y BYOD, mesa limpia y uso de IA generativa.", "Plan por perfiles con objetivos SMART e indicadores; auditoría interna con listas de comprobación y ciclo PDCA."], "ca": [["CA1.1", "Principios generales de la organización en ciberseguridad", "LC", "20", []], ["CA1.2", "Normativa de protección del puesto de trabajo", "LC", "20", ["1.7", "1.8"]], ["CA1.3", "Plan de concienciación para la plantilla", "TO", "20", ["1.5"]], ["CA1.4", "Materiales para las acciones de concienciación", "LC", "20", ["1.6"]], ["CA1.5", "Auditoría de cumplimiento del plan", "TO", "20", []]], "claves": ["<b>CA1.1 y CA1.5 no tienen tarea entregable:</b> se evalúan con el producto de las actividades 1.1 (resumen + mapa conceptual) y 1.5 (checklist + informe de auditoría).", "Los pesos de las tareas (50 / 20 / 15) dejan un 15 % sin asignar: la tarea 1.7 no tiene peso indicado.", "Las tareas de cortafuegos 1.1–1.4 se hacen en la UD4 (CA4.2).", "Phishing siempre aislado: GoPhish contra MailHog, señuelo de un servicio ficticio, ninguna marca ni buzón real.", "Fallo de IA a provocar: <b>alucinación normativa</b> (artículos o casos que no existen)."]}, "ud2": {"teoria": ["Clasificar para priorizar: taxonomía de la Guía Nacional de Notificación, ENISA / eCSIRT.net y prioridad.", "Formatos (Syslog, CEF, LEEF, JSON), eventos clave de Windows (4624, 4625, 4672, 4688), logs de Linux y Sysmon; hora sincronizada e integridad de los registros.", "Detección por firmas y por anomalías; NIDS (Suricata, Snort, Zeek), HIDS (OSSEC / Wazuh), WAF y EDR/XDR.", "Qué hace un SIEM (parsear, normalizar, enriquecer, correlar, alertar), productos del mercado y triaje en el SOC.", "Wazuh con agentes, reglas de Suricata y búsquedas SPL en Splunk.", "Elasticsearch, Logstash, Beats y Kibana; KQL frente a SPL; Security Onion.", "OSINT solo sobre identidades ficticias; clasificar, valorar y dar seguimiento al incidente en TheHive."], "ca": [["CA2.1", "Taxonomía de incidentes de la organización", "LC", "20", ["2.1", "2.2"]], ["CA2.2", "Controles y herramientas de monitorización, detección y alerta", "LC", "20", ["2.3", "2.4", "2.5"]], ["CA2.3", "Detección de incidentes de seguridad física", "TO", "20", []], ["CA2.4", "Detección mediante investigación en fuentes abiertas (OSINT)", "TO", "20", []], ["CA2.5", "Clasificación, valoración, documentación y seguimiento", "TO", "20", []]], "claves": ["<b>CA2.3, CA2.4 y CA2.5 no tienen tarea entregable:</b> se observan en las actividades 2.5 (informe forense con componente físico), 2.3 (OSINT) y 2.4 (registro de incidentes).", "Ninguna tarea indica peso: falta repartir entre ellas la parte de lista de cotejo (40 %).", "En el PDF de la programación CA2.3 y CA2.4 aparecen cruzados con sus actividades; aquí se asignan por el texto del criterio.", "Wazuh es el SIEM principal; Splunk se mantiene para las búsquedas SPL del examen.", "Fallo de IA a provocar: <b>prompt injection a través de un log</b>."]}, "ud3": {"teoria": ["Requisitos de la evidencia (RFC 3227, ISO/IEC 27037, UNE 71505/71506), orden de volatilidad y adquisición en caliente o en frío.", "Copia bit a bit, hash antes y después, almacenamiento seguro y registro de cada paso.", "Disco (Autopsy / Sleuth Kit), memoria (Volatility 3), malware, red y correo (SPF / DKIM / DMARC).", "Indicadores de compromiso, MITRE ATT&amp;CK (tácticas y técnicas), Cyber Kill Chain y Diamond Model.", "STIX/TAXII, MISP, protocolo TLP, REYES y LUCÍA; contener sin destruir la evidencia."], "ca": [["CA3.1", "Compilación y almacenamiento seguro de evidencias", "LC", "20", []], ["CA3.2", "Análisis de evidencias", "TO", "20", ["3.1", "3.2"]], ["CA3.3", "Investigación del incidente", "TO", "20", ["3.1", "3.2"]], ["CA3.4", "Intercambio de información con proveedores u organismos", "LC", "20", []], ["CA3.5", "Primeras medidas de contención", "TO", "20", []]], "claves": ["<b>Solo dos tareas entregables</b>, las dos de análisis e investigación. CA3.1, CA3.4 y CA3.5 se evalúan con las actividades 3.1 (registro + cadena de custodia), 3.4 (evento MISP y notificación) y 3.5 (plan de contención).", "Las dos tareas no indican peso.", "Desde esta unidad la evidencia es «roja»: nada original sale del laboratorio y la IA solo puede ser local (Ollama).", "Análisis de malware estático por defecto; el dinámico en sandbox queda como ampliación.", "Fallo de IA a provocar: <b>atribución alucinada</b> o evidencia subida fuera del laboratorio."]}, "ud4": {"teoria": ["Fases según NIST SP 800-61: preparación, detección, contención, erradicación, recuperación y actuaciones post-incidente.", "Segmentación y DMZ, diseño del ruleset e implementación en nftables (tablas, cadenas, políticas por defecto, log, NAT / DNAT).", "Playbooks con responsable, tiempo objetivo y criterio de salida; matriz de severidad, árbol de escalado, plazos legales y acciones prohibidas.", "Copias 3-2-1 e inmutables, probadas restaurando; RTO y RPO; control de integridad de ficheros (FIM).", "ÁNGELES, LUCÍA, REYES, CARMEN / CLAUDIA; gestión de casos con FIR o TheHive; SOAR."], "ca": [["CA4.1", "Procedimientos de actuación ante los incidentes habituales", "LC", "15", ["4.1", "4.2"]], ["CA4.2", "Respuestas ciberresilientes y cooperación con terceros", "LC", "15", ["1.1", "1.2", "1.3", "1.4", "4.4"]], ["CA4.3", "Flujo de toma de decisiones y escalado", "TO", "20", []], ["CA4.4", "Restablecimiento de los servicios afectados", "LC", "20", []], ["CA4.5", "Documentación y lecciones aprendidas", "TO", "20", ["4.3"]], ["CA4.6", "Seguimiento para evitar que se repita", "TO", "10", []]], "claves": ["Incluye las tareas de cortafuegos 1.1–1.4 traídas de la UD1; conservan su numeración original.", "<b>CA4.3, CA4.4 y CA4.6 no tienen tarea entregable:</b> se evalúan en las actividades 4.3 (flujo de escalado y simulaciones), 4.4 (plan de recuperación) y 4.6 (simulación integral).", "Ninguna tarea indica peso.", "nftables: aceptar en <span class=\"mono\">forward</span> el tráfico ya traducido por DNAT y escribir las interfaces en minúscula.", "La materia del curso del CCN-CERT (tarea 4.1) entra en el examen de la unidad.", "Fallo de IA a provocar: <b>script destructivo</b> o <b>consejo ilegal</b> (hackback, pagar el rescate)."]}, "ud5": {"teoria": ["Guía Nacional de Notificación: ventanilla única, CSIRT de referencia (INCIBE-CERT, CCN-CERT), autoridad competente, AEPD y CNPIC.", "Nivel de peligrosidad e impacto, qué es de notificación obligatoria y notificaciones inicial, intermedia y final.", "RGPD: brecha a la AEPD en 72 h y a los afectados sin dilación. NIS2: alerta temprana en 24 h, notificación en 72 h e informe final en un mes.", "Un mismo incidente contado a técnico, TI, dirección, plantilla y ciudadanía; doble redacción con marcadores y revisión cruzada."], "ca": [["CA5.1", "Procedimiento de notificación en los tiempos adecuados", "LC", "20", ["5.1"]], ["CA5.2", "Notificación al personal interno que decide", "TO", "20", ["5.2"]], ["CA5.3", "Notificación a las autoridades competentes", "LC", "20", ["5.3"]], ["CA5.4", "Notificación formal a las partes afectadas", "TO", "20", ["5.4"]], ["CA5.5", "Notificación a los medios de comunicación", "LC", "20", ["5.5"]]], "claves": ["Una tarea por criterio: cobertura completa.", "Las tareas no indican peso.", "Comprobar al inicio de curso si la ley española que transpone NIS2 ya está en el BOE; mientras no lo esté, rigen los plazos del RGPD y de la Directiva.", "Fallo de IA a provocar: <b>plazo alucinado</b> o <b>datos reales en el comunicado</b>."]}}, "detalle": {"ud1": [{"h": "Principios: la tríada CIA y el resto de propiedades", "html": "<p>Toda la ciberseguridad se ordena alrededor de tres propiedades de la información, la <b>tríada CIA</b>: <b>confidencialidad</b> (solo accede quien está autorizado), <b>integridad</b> (nadie la altera sin permiso) y <b>disponibilidad</b> (está cuando se necesita). Un incidente es, por definición, cualquier suceso que afecta a una de las tres. A ellas se suman la <b>autenticación</b> (probar quién eres), la <b>autorización</b> (qué puedes hacer), la <b>trazabilidad</b> (registrar quién hizo qué) y el <b>no repudio</b> (no poder negar lo hecho).</p><p>Conviene fijar pronto el vocabulario que se usa el resto del curso: una <b>amenaza</b> es un peligro potencial, una <b>vulnerabilidad</b> es la debilidad que la amenaza aprovecha, el <b>riesgo</b> es la combinación de probabilidad e impacto, y el <b>incidente</b> es la amenaza ya materializada. Dos ideas rectoras: <b>defensa en profundidad</b> (varias capas de control, no una sola) y <b>Zero Trust</b> (no confiar por defecto en nada, ni dentro de la propia red).</p>"}, {"h": "Marco normativo y organismos de referencia", "html": "<p>En España el alumnado debe saber a quién acudir. <b>INCIBE</b> (y su <b>INCIBE-CERT</b>) es el CERT de referencia para empresas y ciudadanía; el <b>CCN-CERT</b> cubre el sector público; la <b>OSI</b> orienta a la ciudadanía; la <b>AEPD</b> es la autoridad de protección de datos; y en Galicia existe el <b>CSIRT.gal</b>. Como marcos de control se manejan el <b>ENS</b> (Esquema Nacional de Seguridad, RD 311/2022, obligatorio en el sector público), la familia <b>ISO/IEC 27000</b> y los <b>CIS Controls</b>. En el plano legal, el <b>RGPD</b> rige los datos personales y la <b>Directiva NIS2</b> la seguridad de servicios esenciales.</p>"}, {"h": "Panorama de amenazas y tendencias", "html": "<p>Los <b>actores</b> van desde la ciberdelincuencia con ánimo de lucro hasta el <b>hacktivismo</b>, el <b>ciberespionaje</b> y las <b>APT</b> (amenazas persistentes avanzadas, dirigidas y sigilosas), el ciberterrorismo y las campañas de desinformación. Entre las <b>tendencias</b> actuales destacan el <b>ransomware como servicio (RaaS)</b> y la <b>doble extorsión</b> (cifrar y además amenazar con publicar), los ataques a la <b>cadena de suministro</b> y el <b>fraude del CEO/BEC</b>. El <b>malware</b> se clasifica en virus, gusano, troyano, spyware, adware, rootkit y ransomware, entre otros.</p><p><b>Giro 2026 — la IA como multiplicador:</b> las mismas familias de amenazas, pero más rápidas, baratas y creíbles. El phishing generado por IA logra muchos más clics y ya está detrás de buena parte del fraude BEC; los <b>deepfakes</b> de voz y vídeo permiten suplantar a un directivo para autorizar pagos; el <b>ransomware</b> se vuelve autónomo (el agente elige objetivo, exfiltra y cifra) con doble y triple extorsión; y un agente puede convertir un <b>CVE</b> público en un exploit. La idea de fondo: la IA <b>comprime el ciclo de ataque</b> y reduce la barrera de entrada al cibercrimen. El desarrollo con cifras y casos está en «Trabajar con IA → Amenazas potenciadas por IA».</p>"}, {"h": "Ingeniería social: el eslabón humano", "html": "<p>La mayoría de los incidentes empiezan por una persona, no por una máquina. El <b>phishing</b> (y sus variantes <b>spear-phishing</b> dirigido, <b>smishing</b> por SMS, <b>vishing</b> por voz y <b>QRishing</b> por código QR) busca que la víctima entregue credenciales o ejecute algo. Se combinan con <b>spoofing</b> (suplantación de remitente o dominio), <b>pretexting</b> (una excusa creíble), <b>baiting</b> (un cebo, como un USB abandonado) y técnicas físicas como el <b>tailgating</b>. La contramedida no es técnica sino de <b>concienciación</b>: por eso la unidad culmina en un plan de formación.</p>"}, {"h": "Protección del puesto de trabajo", "html": "<p>La normativa del puesto traduce los principios a reglas del día a día: <b>actualizaciones</b> al día, <b>control de dispositivos extraíbles</b> (registro de USB autorizados), política de <b>almacenamiento</b> y de <b>copias de seguridad</b>, <b>antimalware</b>, <b>borrado seguro</b> y <b>clasificación de la información</b> (confidencial / interna / pública). En accesos: <b>contraseñas</b> robustas con gestor, <b>doble factor (MFA)</b> y control de acceso por roles. Y las prácticas cotidianas: <b>correo</b> con cuidado ante adjuntos y enlaces, <b>teletrabajo y BYOD</b> con VPN, <b>mesa limpia</b> y una cláusula explícita de <b>uso de IA generativa</b>.</p>"}, {"h": "Plan de concienciación y auditoría", "html": "<p>Un plan de concienciación eficaz define <b>públicos</b> diferenciados (no es igual el personal técnico que la administración o la dirección), <b>objetivos SMART</b>, acciones (charlas, boletines, pósters, simulacros de phishing) e <b>indicadores (KPIs)</b> para medir si funciona. La <b>auditoría interna</b> cierra el ciclo: con una lista de comprobación se verifica el cumplimiento de la normativa, se detectan desviaciones y se proponen mejoras, en un ciclo de mejora continua <b>PDCA</b>.</p>"}], "ud2": [{"h": "Taxonomía de incidentes", "html": "<p>Antes de detectar hay que saber nombrar. La <b>taxonomía</b> estandariza el lenguaje, facilita priorizar y permite cumplir la normativa. En España se usa la de la <b>Guía Nacional de Notificación y Gestión de Ciberincidentes</b>, alineada con la taxonomía de referencia de <b>ENISA/eCSIRT.net</b>. Agrupa los incidentes en familias: contenido abusivo, contenido malicioso, obtención de información, intento de intrusión, intrusión, disponibilidad, compromiso de la información, fraude, vulnerable y otros (APT, ciberterrorismo…). Existe además una clasificación por <b>prioridad</b> de resolución: emergencia, alta, normal y baja.</p>"}, {"h": "Logs: la materia prima de la detección", "html": "<p>Sin registros no hay detección. Una política de <b>logs</b> decide qué actividad se registra (accesos, inicios de sesión, cambios de configuración y permisos, fallos de aplicaciones…), qué campos lleva cada entrada (usuario, equipo, IP/MAC, protocolo, fecha-hora, tipo de evento), en qué <b>formato</b> (Syslog, CEF, LEEF, JSON) y cómo se protege e integra en copias. En Windows la fuente es el <b>Visor de eventos</b> (eventos de seguridad como el 4624/4625 de inicio de sesión); en Linux, ficheros como <span class='mono'>/var/log/secure</span> o <span class='mono'>/var/log/auth.log</span>. <b>Sysmon</b> añade visibilidad fina del endpoint. Un requisito crítico: <b>sincronizar el reloj</b> de todas las fuentes.</p>"}, {"h": "IDS/IPS, WAF y EDR", "html": "<p>Un <b>IDS</b> detecta intrusiones y avisa; un <b>IPS</b> además las bloquea. Detectan por <b>firmas</b> (patrones conocidos, buenos contra lo conocido) o por <b>anomalías</b> (desviaciones de una línea base, útiles contra lo nuevo). Según dónde miran son de red (<b>NIDS</b>, como Suricata, Snort o Zeek) o de host (<b>HIDS</b>, como OSSEC o Wazuh). Se evalúan con verdaderos positivos, <b>falsos positivos</b> y <b>falsos negativos</b>. El <b>WAF</b> filtra específicamente tráfico web (SQLi, XSS), y el <b>EDR/XDR</b> vigila el endpoint con aprendizaje automático y sandboxing.</p>"}, {"h": "El SIEM: correlación y operación", "html": "<p>El <b>SIEM</b> es el cerebro del SOC: recoge logs de todas las fuentes, los <b>parsea, normaliza, categoriza, agrega y correla</b>, y genera alertas cuando un patrón coincide con una regla (p. ej. 20 fallos de login seguidos de un acceso correcto = fuerza bruta). Se organiza en tres capas —recolección, correlación y almacenamiento— y vive de sus <b>casos de uso</b> y <b>reglas</b>, que el analista afina para reducir falsos positivos. En el aula el SIEM es <b>Wazuh</b>; <b>Splunk</b> se usa para practicar el lenguaje de búsqueda <b>SPL</b>.</p>"}, {"h": "El stack del aula: Wazuh + Suricata + Splunk", "html": "<p>El escenario une las piezas: <b>Suricata</b> vigila el tráfico de la red interna y escribe sus alertas en <span class='mono'>eve.json</span>; sus reglas (sintaxis Snort) tienen cabecera (acción, protocolo, origen→destino) y opciones (<span class='mono'>msg</span>, <span class='mono'>sid</span>, <span class='mono'>threshold</span>…). <b>Wazuh</b> recoge con agentes los eventos de las víctimas y los convierte en alertas correlacionadas. <b>Splunk</b> permite buscar sobre esos eventos con SPL y definir alertas programadas o en tiempo real. Es el montaje sobre el que se practica el triaje.</p>"}, {"h": "Elastic Stack (ELK) como alternativa", "html": "<p>Como alternativa profesional se presenta el <b>Elastic Stack (ELK)</b>: <b>Elasticsearch</b> (almacenamiento y búsqueda), <b>Logstash</b> y <b>Beats</b> (ingesta) y <b>Kibana</b> (visualización), con el lenguaje <b>KQL</b> frente al SPL de Splunk. <b>Security Onion</b> empaqueta varias de estas herramientas listas para monitorización de red.</p>"}, {"h": "OSINT, clasificación y seguimiento", "html": "<p>La <b>inteligencia de fuentes abiertas (OSINT)</b> investiga la huella pública de una organización; en el aula se hace <b>solo sobre identidades ficticias sembradas por el profesorado</b>, nunca sobre personas reales (sería ilegal y vulneraría el RGPD). Por último, los incidentes detectados se <b>clasifican, valoran y siguen</b> en una herramienta de gestión de casos como <b>TheHive</b>, que convierte alertas sueltas en fichas con gravedad, responsable y estado.</p>"}], "ud3": [{"h": "La evidencia digital y sus principios", "html": "<p>Una <b>evidencia</b> es un elemento que demuestra un hecho; la mayoría son digitales. Para que valga —sobre todo si puede acabar en un juicio— debe ser <b>admisible, auténtica, completa, fiable y creíble</b> (guía <b>RFC 3227</b>) y la metodología <b>verificable, reproducible, repetible e independiente</b> (<b>ISO/IEC 27037</b>, <b>UNE 71505/71506</b>). Se distingue el <b>análisis forense</b> (orientado a presentar pruebas) de la <b>investigación de incidentes</b> (orientada a responder rápido y contener).</p><p>Clave operativa: el <b>orden de volatilidad</b>. Se recoge primero lo más efímero (registros y caché, memoria RAM, conexiones y procesos) y después lo estable (disco, logs, soportes externos). La adquisición puede ser <b>en caliente</b> (live, sin apagar, para no perder lo volátil) o <b>en frío</b> (dead, desconectando la alimentación para clonar el disco sin alterarlo).</p>"}, {"h": "Cadena de custodia e integridad", "html": "<p>La <b>cadena de custodia</b> documenta dónde, cuándo y quién descubrió, recogió y manipuló cada evidencia, y cada cambio de manos. Se trabaja siempre sobre <b>copias bit a bit</b> (nunca sobre el original), se <b>formatea con borrado seguro</b> el destino para no contaminar, y se calculan <b>funciones hash</b> (MD5 + SHA) del origen y de la copia: si coinciden, se prueba que la evidencia no se ha alterado. Se etiqueta, inventaría y guarda en lugar seguro, documentando todos los accesos.</p>"}, {"h": "Análisis forense: disco, memoria, red y correo", "html": "<p>Según la fuente se usan técnicas y herramientas distintas: <b>disco</b> con Autopsy/Sleuth Kit (recuperar archivos borrados, estudiar particiones), <b>memoria</b> con Volatility 3 sobre un volcado (procesos y conexiones en el momento del incidente), <b>red</b> con Wireshark, y <b>correo</b> analizando la cabecera (<span class='mono'>Received</span>, <span class='mono'>Return-Path</span>) y la autenticación <b>SPF/DKIM/DMARC</b> para detectar phishing y suplantación. Plataformas como VirusTotal ayudan, pero no se suben evidencias originales: se consultan por su hash.</p>"}, {"h": "Indicadores de compromiso y MITRE ATT&CK", "html": "<p>Un <b>indicador de compromiso (IOC)</b> es una huella del ataque: IP o dominio de C&amp;C, hash de un fichero malicioso, una clave de registro, un nombre de proceso. La matriz <b>MITRE ATT&amp;CK</b> ordena el comportamiento de los atacantes en <b>tácticas</b> (el objetivo) y <b>técnicas</b> (cómo lo logran), cada una con su identificador. Permite, a partir de una observación, relacionarla con una técnica, deducir qué hará el atacante después y cómo mitigarlo. Se complementa con la <b>Cyber Kill Chain</b> y el <b>Diamond Model</b>.</p>"}, {"h": "Intercambio de información y primeras medidas", "html": "<p>Compartir los IOC protege a otros: existen estándares como <b>STIX/TAXII</b>, <b>MISP</b>, OpenIOC o IODEF, y el protocolo semáforo <b>TLP</b> para marcar hasta dónde puede difundirse cada dato. En España el CCN ofrece <b>REYES</b> (basado en MISP) y <b>LUCÍA</b>; cuando hay datos personales se avisa a la <b>AEPD</b> y, si hay delito, a las Fuerzas y Cuerpos de Seguridad. Las <b>primeras medidas de contención</b> buscan frenar sin destruir evidencia: aislar el equipo o segmento, bloquear cuentas, aplicar parches o reglas, siempre valorando riesgo de daño, preservación de la prueba, disponibilidad del servicio y reversibilidad.</p>"}], "ud4": [{"h": "El ciclo de vida de la gestión de incidentes", "html": "<p>La respuesta sigue las fases del <b>NIST SP 800-61</b> (y la guía de INCIBE-CERT): <b>preparación</b> (contactos, herramientas, imágenes de restauración, formación), <b>identificación/detección</b>, <b>contención</b>, <b>mitigación/erradicación</b>, <b>recuperación</b> y <b>actuaciones post-incidente</b>. La preparación es la fase que marca la diferencia: cuando se declara el incidente, ya es tarde para empezar a planificar. Dos reglas de oro: documentar cada paso en una bitácora, y pedir autorización al área de negocio antes de una contención de gran impacto («que el remedio no sea peor que la enfermedad»).</p>"}, {"h": "Diseño de cortafuegos y segmentación de red", "html": "<p>Aquí aterrizan las tareas 1.1–1.4. <b>Netfilter</b> es el cortafuegos de Linux y <b>nftables</b> su herramienta de configuración, organizada en <b>tablas</b>, <b>cadenas</b> (hooks prerouting, input, forward, output, postrouting) y <b>reglas</b>. Se parte de un diseño de red con departamentos y <b>DMZ</b>, se escribe el <b>ruleset</b> con política por defecto <b>drop</b>, se añaden <b>registros (log)</b> y <b>NAT/DNAT</b> para publicar servicios, y se securiza con un segundo cortafuegos. Dos correcciones que el alumnado debe interiorizar: las interfaces van en <b>minúscula</b> (<span class='mono'>enp0s8</span>), y tras un <b>DNAT</b> hay que <b>aceptar además en la cadena forward</b> el tráfico ya traducido o se descarta.</p>"}, {"h": "Playbooks, severidad y escalado", "html": "<p>Un <b>playbook</b> es un procedimiento ejecutable para un tipo de incidente, con acciones numeradas, responsable, tiempo objetivo y criterio de salida de cada fase. La <b>matriz de severidad</b> y el <b>árbol de escalado</b> deciden a quién se avisa y cuándo, con los <b>plazos legales</b> incorporados. Importante: incluir una sección de <b>acciones prohibidas</b> (no negociar con el atacante, no «hackear de vuelta»). El criterio de calidad es objetivo: un playbook vale cuando otro grupo lo ejecuta sin preguntar nada a sus autores.</p><p><b>El playbook no sirve si no se entrena.</b> Un manual de respuesta es un plan preescrito que cubre identificar, contener, erradicar, recuperar y aprender; pero su valor real aparece cuando el equipo lo ha <b>ensayado</b> y cada persona conoce su rol. La capacitación acorta el tiempo entre <b>detección y respuesta</b> (que es donde se gana o se pierde el incidente), ayuda a cumplir obligaciones como el RGPD y alimenta la mejora continua a partir de incidentes pasados. Por eso en el aula el playbook se valida ejecutándolo: lo que no se ha practicado, en caliente no funciona.</p>"}, {"h": "Ciberresiliencia: copias, RTO/RPO y continuidad", "html": "<p>Resiliencia es seguir prestando servicio pese al incidente. Las <b>copias de seguridad</b> siguen la regla <b>3-2-1</b> (tres copias, dos soportes, una fuera) y conviene que sean <b>inmutables</b>; sobre todo, una copia no probada no es una copia: hay que <b>verificar restaurando</b>. Se fijan el <b>RTO</b> (tiempo máximo aceptable sin servicio) y el <b>RPO</b> (dato máximo que se puede perder) por servicio, y se vigila la integridad con <b>FIM</b>.</p>"}, {"h": "Herramientas del CCN-CERT y del sector público", "html": "<p>El sector público español cuenta con un ecosistema propio: la plataforma de formación <b>ÁNGELES</b> del CCN, <b>LUCÍA</b> (gestión de incidentes), <b>REYES</b> (intercambio de amenazas), <b>CARMEN/CLAUDIA</b> (detección avanzada). Para la gestión de casos en el laboratorio se usan <b>FIR</b> o <b>TheHive</b>, y el concepto de <b>SOAR</b> introduce la automatización de la respuesta.</p>"}], "ud5": [{"h": "Marco de notificación y ventanilla única", "html": "<p>La <b>Guía Nacional de Notificación y Gestión de Ciberincidentes</b> define una <b>ventanilla única</b>: el afectado notifica a su <b>CSIRT de referencia</b> (<b>INCIBE-CERT</b> para el ámbito privado y la ciudadanía, <b>CCN-CERT</b> para el sector público) y este deriva, según el caso, a la autoridad competente: a la <b>AEPD</b> si hay datos personales, al <b>CNPIC</b> si hay infraestructura crítica, a ESP-DEF-CERT si afecta a Defensa. Cada canal tiene su plantilla de notificación.</p>"}, {"h": "Peligrosidad, impacto y plazos", "html": "<p>Un incidente se mide por su <b>peligrosidad</b> (la amenaza potencial, según su tipo en la taxonomía) y por su <b>impacto</b> (las consecuencias reales: servicio afectado, datos, personas, economía, reputación). Ambos se gradúan en CRÍTICO, MUY ALTO, ALTO, MEDIO y BAJO. Son de <b>notificación obligatoria</b> los niveles ALTO, MUY ALTO y CRÍTICO. El reporte a la autoridad se hace en tres momentos: <b>notificación inicial</b> (inmediata, al conocer el incidente), <b>intermedia</b> (24–72 h según nivel) y <b>final</b> (20–40 días).</p>"}, {"h": "RGPD y NIS2", "html": "<p>Dos normas marcan los plazos que el alumnado <b>siempre debe verificar en la fuente</b>, porque es el dato que la IA falla con más frecuencia. El <b>RGPD</b> obliga a notificar una brecha de datos personales a la <b>AEPD en 72 horas</b> y a los afectados sin dilación cuando hay alto riesgo. La <b>Directiva NIS2</b> fija para servicios esenciales una <b>alerta temprana en 24 h</b>, una <b>notificación en 72 h</b> y un <b>informe final en un mes</b>.</p><div class='note warn'><div><b>Dato a verificar cada curso:</b> a julio de 2026 la ley española que transpone NIS2 seguía sin publicarse en el BOE; mientras tanto rigen los plazos del RGPD y de la propia Directiva. Compruébalo al inicio de curso.</div></div><p><b>El marco europeo de IA (2026):</b> además de RGPD y NIS2, el analista debe situar el <b>AI Act</b> (Reglamento de IA, de aplicación directa), <b>DORA</b> (resiliencia del sector financiero) y el <b>Cyber Resilience Act</b> (seguridad desde el diseño del producto). El <b>Plan de Acción de IA y Ciberseguridad</b> de la Comisión (COM(2026) 577 final, 7-jul-2026) es una <b>Comunicación</b>, no un reglamento: no impone obligaciones por sí mismo, sino que coordina a la Oficina Europea de IA, ENISA, el JRC y el ECCC y actúa de puente entre el AI Act y la operación diaria. Distinguir el tipo de norma —reglamento, directiva o comunicación— es, en sí mismo, criterio evaluable.</p>"}, {"h": "Comunicación multi-audiencia y gestión de crisis", "html": "<p>El mismo incidente se cuenta distinto a cada público —<b>técnico</b>, <b>responsable de TI</b>, <b>dirección</b>, <b>plantilla</b> y <b>ciudadanía</b>— sin cambiar ni un hecho: cambia el detalle, el tono y la longitud, no la verdad. Dos reglas protegen la comunicación: la <b>doble redacción</b> (se trabaja con marcadores y los datos reales se sustituyen al final, a mano) y la <b>revisión cruzada</b> antes de enviar (¿hay algún hecho sin confirmar?, ¿alguna frase admite culpa sin base?, ¿se entiende?). En crisis, nada de especular sobre causas ni autores antes de tiempo.</p>"}]}, "prac": {"ud1": [["Protección del puesto y cifrado", ["Firewall en Linux con UFW", "Cifrado de datos con GPG", "Integridad con funciones hash", "Protección del puesto de trabajo", "Kit de concienciación"]], ["Contraseñas y ataques de acceso", ["Diccionarios con Crunch + John the Ripper", "Ataque de fuerza bruta con Hydra y Medusa", "Denegación de servicio (DoS)", "Control remoto (RAT) sobre un PC"]]], "ud2": [["Taxonomía y clasificación", ["Reflexión y ejercicios de taxonomía", "Clasificación de incidentes", "Catalogación de peligrosidad"]], ["Seguridad física (CA2.3)", ["Seguridad física de un espacio (aula SMR2)", "Identificación de riesgos físicos", "Riesgos, medidas y protocolos"]], ["OSINT (CA2.4)", ["SpiderFoot + OSINT", "SSH + OSINT", "Herramientas de búsqueda en redes sociales", "Búsqueda sobre el documento CCN-STIC 817"]], ["Monitorización y detección", ["Suricata: instalación, test y reglas", "ElasticStack (dos prácticas)", "GoPhish", "Phishing y emulación web", "Stealers y keyloggers", "TheHive"]], ["Clasificación y seguimiento (CA2.5)", ["Clasificación, valoración, documentación y seguimiento inicial", "Ejercicios sobre normativa de notificación"]]], "ud3": [["Evidencias y custodia (CA3.1)", ["Duplicado de disco con dd", "Triple borrado seguro", "Selección de fuentes para buscar evidencias", "Estrategia de recopilación y almacenamiento", "Acuerdo de confidencialidad (NDA)"]], ["Análisis de evidencias (CA3.2)", ["Adquisición + recuperación de archivos borrados (informe)", "Windows Sandbox: análisis de URL sospechosa"]], ["Investigación e IOC (CA3.3)", ["Indicadores de compromiso", "Reglas YARA para archivos", "Reglas YARA para tráfico de red", "Keylogger + IOC", "Emerging Threats / Snort"]], ["Primeras medidas de contención (CA3.5)", ["Restricción de peticiones ante DoS", "Medidas ante cuenta comprometida", "Plan de respuesta ante un incidente"]]], "ud4": [["Procedimientos y planes (CA4.1/4.2)", ["Prevención vs respuesta: importancia de un plan", "Playbook (diagramas de flujo por fase) + Runbook", "SOP (procedimiento operativo)", "Jerarquía de planes: SOP / IRP / BCP / DRP"]], ["Caso práctico y análisis", ["Logs de ataque a servidor Apache (análisis e infraestructura de registro)", "MITRE ATT&CK: ejercicios y Navigator", "IDS en simulación vs en producción", "Caso de ransomware"]], ["Herramientas de gestión y respuesta", ["TheHive", "FIR (instalación y configuración)", "MISP, IntelMQ, MineMeld", "cowrie (honeypot)", "CCN-CERT ÁNGELES y ATENEA", "ENISA / CSIRT Maturity Self-assessment"]]], "ud5": [["Notificación de brechas (CA5.3)", ["Notificación a autoridades", "Asesora Brecha (AEPD)", "Comunica Brecha RGPD", "Notificación en el sector privado a la AEPD", "Guía del EDPB"]], ["Detección y documentación", ["IDS/IPS Snort", "SIEM ELK"]]]}, "sols": {"ud1": {"act": {"1.1": "<p><b>Qué debe contener:</b> tres incidentes reales <b>verificados en fuente primaria</b> (INCIBE/CCN-CERT, BOE o prensa solvente), cada uno con: qué pasó, servicio afectado y a quién, principio CIA roto y fuente. El mural conserva <b>tachados</b> los casos no verificables, con la razón del descarte.</p><p><b>Ejemplos válidos 2021-2025:</b> ataque a los sistemas del SEPE (2021, disponibilidad), brecha del Ayuntamiento/Diputación con cifrado de servicios, incidentes en universidades gallegas. El mapa conceptual relaciona amenaza→vulnerabilidad→impacto. <b>Clave de corrección:</b> que cada afirmación tenga fuente; un caso verosímil sin fuente se descarta.</p>", "1.2": "<p><b>Normativa del puesto (2 pág.)</b> con: ámbito, uso de equipos, contraseñas y MFA, correo y navegación, extraíbles, teletrabajo, mesa limpia, uso de IA generativa e incumplimientos. Cada cláusula se mapea a un control <b>real</b> del ENS (RD 311/2022, p. ej. medidas <span class='mono'>op.acc</span>, <span class='mono'>mp.eq</span>) o ISO 27002. <b>Decálogo</b> derivado de la normativa.</p><p>Endurecimiento Windows: política de contraseñas por <span class='mono'>secpol.msc</span>, bloqueo de pantalla, BitLocker, gestor (KeePassXC), bloqueo de USB por directiva. Simulación GoPhish→MailHog <b>aislada</b> (ver tarea 1.7/1.8). Corrección: ninguna cláusula con cita legal inventada.</p>", "1.3": "<p><b>Plan formativo</b> con objetivos SMART, públicos diferenciados (ESO, ciclos, profesorado, PAS), acciones (charlas, boletines, pósters, simulacro de phishing), calendario e <b>indicadores</b> (p. ej. % de clics en el simulacro como línea base). La defensa: el alumnado sabe justificar por qué cada acción encaja con su público.</p>", "1.4": "<p><b>Kit de campaña</b>: infografía + vídeo 60-90 s + cartel A3, con hilo visual común y tres mensajes del decálogo. Cada pieza <b>declara si usa imagen generada por IA</b> y pasa revisión de accesibilidad (contraste, texto alternativo, lenguaje claro) por otro grupo. Corrección: sin marcas/personajes protegidos; mensaje accionable.</p>", "1.5": "<p><b>Checklist de auditoría</b> construida desde CIS Controls/ENS (una fila por cláusula de la normativa, con evidencia requerida y método de comprobación). Auditoría manual sobre win10 y srvweb + módulo <b>SCA de Wazuh</b> (% de cumplimiento CIS). Informe con hallazgos, riesgo y mejoras priorizadas. Corrección: cada hallazgo se apoya en evidencia concreta, no en impresión.</p>"}, "tar": {"1.5": "<p><b>Solución (50%).</b> PDF por parejas con índice e introducción. Debe cubrir: análisis de públicos del centro (ESO, ciclos —distinguiendo informática de otros—, profesorado, PAS), riesgos frecuentes por perfil, objetivos, acciones de difusión (charlas, boletines, cartelería) y <b>justificación</b> de cada decisión. Rúbrica: cobertura de todos los perfiles, coherencia riesgo→acción, y justificación (no vale un plan genérico igual para todos).</p>", "1.6": "<p><b>Solución (20%).</b> PDF con un póster A3 por página, derivados del plan 1.5. Se valora: mensaje único y claro por póster, llamada a la acción, legibilidad a distancia, accesibilidad (contraste) y que no reproduzcan marcas/personajes protegidos. Un póster por cada riesgo prioritario del plan.</p>", "1.7": "<p><b>Solución.</b> GoPhish instalado y una campaña de prueba <b>totalmente aislada</b>: servidor de envío apuntando a <b>MailHog</b> (no a Internet), plantilla de correo señuelo de un servicio ficticio de TecnoMariña, <em>landing</em> de captura propia y grupo de destinatarios ficticios. PDF con capturas de: perfil de envío, plantilla, landing page, grupo y lanzamiento. Corrección: ningún destinatario ni marca real; los correos caen en MailHog.</p>", "1.8": "<p><b>Solución (15%).</b> Informe de la campaña: pretexto elegido y por qué es creíble, construcción de la página anzuelo, selección de usuarios objetivo (ficticios), resultados (tasa de apertura/clic/envío de credenciales sobre MailHog) y <b>medidas de concienciación</b> derivadas. Se conecta con el KPI del plan 1.5.</p>"}}, "ud2": {"act": {"2.1": "<p><b>Trabajo sin IA primero:</b> taxonomía propia a dos niveles con ejemplos. Después se contrasta con la de referencia (Guía Nacional / ENISA): el alumnado detecta categorías que le faltan, solapes y un incidente que no encajaría. Producto: mural con la taxonomía propia + anotaciones + decisión razonada de qué se acepta.</p>", "2.2": "<p><b>Generar tráfico</b> desde kali contra la víctima; <b>triaje</b> de 20-30 alertas de Wazuh clasificadas VP/FP/necesita contexto; contraste ciego con dos alumnos y discusión solo de discrepancias. Escritura de una regla (Sigma→Wazuh/Suricata) para el patrón detectado y prueba. Ver reglas concretas en la tarea 2.3. Corrección: la IA nunca cierra una alerta.</p>", "2.3": "<p><b>Solo sobre identidad ficticia sembrada.</b> La IA da el <b>plan</b> OSINT por fases; la ejecución es manual (buscadores, whois simulado, metadatos). Informe con hallazgos, lista de fuentes y, sobre todo, qué conclusiones <b>no</b> se sostienen con la evidencia. Corrección: nada sobre personas reales (RGPD).</p>", "2.4": "<p>Registro estandarizado (TheHive o ficha estructurada): a partir de un relato desordenado (correo de usuario contradictorio) sale una ficha completa con criticidad = impacto × urgencia, <b>decidida por el alumnado</b>. Corrección: criticidad justificada y campos completos.</p>", "2.5": "<p>Incidente complejo con componente digital <b>y físico</b> (CA2.3): línea temporal a partir de eventos sueltos y revisión cruzada (la IA hace de responsable que recibe el informe y señala lagunas). Entrega: informe forense + reflexión.</p>"}, "tar": {"2.1": "<p><b>Solución.</b> Comparar al menos dos catálogos (p. ej. ENISA/eCSIRT.net frente a la clasificación de un fabricante o de MITRE) con la de referencia de la Guía Nacional. Señalar coincidencias, diferencias de granularidad y categorías que una tiene y otra no.</p>", "2.2": "<p><b>Solución.</b> Taxonomía a dos niveles (categoría principal → tipo) adaptada a TecnoMariña, con un ejemplo por tipo. Debe cubrir al menos: contenido malicioso, intrusión, disponibilidad, compromiso de la información, fraude y obtención de información. Se valora que los ejemplos sean plausibles para la organización.</p>", "2.3": "<p><b>Enunciado real:</b> cuatro alertas — (1) <em>priority 4</em> SSH hacia la red interna; (2) <em>priority 1</em> salida de la red interna hacia 85.91.64.65, 82.146.39.249, 5.196.213.99, 212.118.8.147; (3) <em>priority 4</em> UDP/53 hacia una red que no sea la interna; (4) <em>priority 2</em> &gt;100 ICMP/min de la interna hacia el exterior.</p><div class='code'><div class='bar'><span class='who'>/etc/suricata/rules/custom.rules</span></div><pre>alert tcp $EXTERNAL_NET any -&gt; $HOME_NET 22 (msg:\"SSH hacia red interna\"; priority:4; sid:1000020; rev:1;)\nalert ip $HOME_NET any -&gt; [85.91.64.65,82.146.39.249,5.196.213.99,212.118.8.147] any (msg:\"Salida a IP marcada\"; priority:1; sid:1000021; rev:1;)\nalert udp $HOME_NET any -&gt; $EXTERNAL_NET 53 (msg:\"DNS a red externa\"; priority:4; sid:1000022; rev:1;)\nalert icmp $HOME_NET any -&gt; $EXTERNAL_NET any (msg:\"Exceso ICMP saliente\"; threshold:type threshold, track by_src, count 100, seconds 60; priority:2; sid:1000023; rev:1;)</pre></div><p>Alternativa con <span class='mono'>classtype</span> (definido en <span class='mono'>classification.config</span>) en vez de <span class='mono'>priority</span>. Pruebas: PuTTY/SSH a Kali, <span class='mono'>telnet</span>/<span class='mono'>ping</span> a las IP, <span class='mono'>nmap -sU -p53</span>, y <span class='mono'>hping3 --icmp --fast -c 150</span> (ojo: en el original figura <span class='mono'>--icmp—fast</span> con guion largo, no funciona). Validar con <span class='mono'>suricata -T</span>.</p>", "2.4": "<p><b>Enunciado real:</b> (1.1) eventos con <span class='mono'>src_ip</span>=tu IP, rango <em>All time</em>; (1.2) eventos de estadísticas de Suricata; (1.3) ataque DoS en los últimos 5 min con IP y puerto origen; (2) alerta programada &gt;100 \"Outbound ICMP detected\" en 24 h, cada hora, única; (3) alerta en tiempo real de salida hacia 89.45.235.21 + su regla de Suricata.</p><div class='code'><div class='bar'><span class='who'>SPL</span></div><pre>index=suricata src_ip=\"&lt;tu_IP&gt;\"                                  <span class='c'># 1.1 (All time)</span>\nindex=suricata event_type=stats                                   <span class='c'># 1.2 estadísticas</span>\nindex=suricata event_type=alert category=\"DoS attack\" | table _time,src_ip,src_port   <span class='c'># 1.3 (últimos 5 min)</span>\nindex=suricata event_type=alert signature=\"*Outbound ICMP detected*\"  <span class='c'># 2: alerta programada, &gt;100, 24h, cada hora</span>\nindex=suricata event_type=alert dest_ip=\"89.45.235.21\"               <span class='c'># 3: alerta en tiempo real</span></pre></div><div class='code'><div class='bar'><span class='who'>regla Suricata (apartado 3)</span></div><pre>alert ip $HOME_NET any -&gt; 89.45.235.21 any (msg:\"Salida a IP sospechosa 89.45.235.21\"; sid:1000024; rev:1;)</pre></div><p>La alerta programada lleva <em>trigger</em> &gt;100 en ventana de 24 h; la de tiempo real, <em>throttle</em> para no inundar. Comprobar en <em>Activity → Triggered alerts</em>.</p>", "2.5": "<p><b>Enunciado real:</b> sobre logs de Apache — (1.1) peticiones que no sean GET ni POST; (1.2) errores 5xx mostrando timestamp, URI y código; (1.3) lista de IP origen (<span class='mono'>dedup</span>); (1.4) peticiones cuya URI contenga \"SQL\" con timestamp, URI e IP; (2) ingesta del log de <span class='mono'>almhuette-raith.at/apache-log/access.log</span> y repetir, buscando además SQLi.</p><div class='code'><div class='bar'><span class='who'>SPL</span></div><pre>index=main method!=GET method!=POST                                   <span class='c'># 1.1</span>\nindex=main status&gt;=500 status&lt;=599 | table _time,uri,status            <span class='c'># 1.2</span>\nindex=main | dedup clientip | table clientip                          <span class='c'># 1.3</span>\nindex=main uri=\"*SQL*\" | table _time,uri,clientip                      <span class='c'># 1.4</span>\nindex=main \"*SELECT*FROM*\"                                            <span class='c'># 2: SQL injection</span></pre></div><p>Patrón de SQLi: <span class='mono'>*SELECT*FROM*</span> (y variantes <span class='mono'>*1=1*</span>, <span class='mono'>*UNION*</span>, <span class='mono'>*DROP*</span>). PDF con capturas de cada resultado.</p>"}}, "ud3": {"act": {"3.1": "<p>Recogida manual con <b>hash SHA-256 antes y después</b>, formulario de cadena de custodia y testigo, respetando el <b>orden de volatilidad</b>. La IA solo diseña la plantilla y hace de abogado contrario buscando huecos. Entrega: registro de evidencias con hashes + formulario + informe de métodos.</p>", "3.2": "<p>Desofuscar un PowerShell codificado con CyberChef y pedir a la IA explicación línea a línea + técnica MITRE + artefactos que deja. Mapear a ATT&CK (validando en el Navigator) y construir línea temporal normalizada a UTC (verificar ≥20% a mano). Entrega: informe de análisis reproducible.</p>", "3.3": "<p>La IA genera <b>hipótesis</b> (incluida una que no implique atacante externo), no conclusiones; el alumnado busca la evidencia de <b>refutación</b> de cada una. Informe con cronología y tabla de IOC, redactado en tres niveles: confirmado / probable / hipótesis.</p>", "3.4": "<p>Borrador de notificación a INCIBE-CERT/CCN-CERT, <b>filtro de divulgación</b> (quitar datos personales y detalles que faciliten reproducir el ataque), IOC a formato MISP/STIX y uso del protocolo <b>TLP</b>. Role play con la IA como analista del CERT que pide aclaraciones.</p>", "3.5": "<p>La IA propone <b>5 medidas de contención con sus efectos secundarios</b> (qué contiene, qué servicio rompe, qué evidencia destruye, reversión), ordenadas de menos a más destructivas para la evidencia. El alumnado decide y justifica el equilibrio contener↔preservar.</p>"}, "tar": {"3.1": "<p><b>Solución (reto forense, caso \"Vientos remotos, tempestades locales\").</b> CTF guiado en varias partes (Security Art Work). El PDF entregable documenta, por cada reto: la evidencia usada, su <b>hash</b> verificado, la herramienta (Autopsy/Volatility/strings/análisis de red) y el razonamiento hasta la bandera. Se corrige la metodología (trabajar sobre copia, cadena de custodia, verificación de hash), no solo el resultado. La guía oficial se reparte en 5 partes.</p>", "3.2": "<p><b>Enunciado real:</b> caso forense <b>MINAF</b> (Minerías Alcázar y Ferrán): un fraude del CEO (BEC) en el que se suplanta al director general por correo y se ordenan transferencias por 100.000 €. Infraestructura: Exchange 2010 con OWA/ActiveSync, triaje de los PC del CEO (PC2) y del CFO (PC1), ficheros OST/PST, <span class='mono'>EventHistoryDB</span> y logs CAS. Herramientas: Kernel Outlook OST/PST Viewer.</p><p><b>Claves de la investigación:</b> el PST de Exchange guarda en <em>Recoverable Items → Deletions</em> los correos que el atacante borró (el usuario no puede tocar esa carpeta); el <span class='mono'>EventHistoryDB</span> está en <b>UTC</b> y permite seguir el ciclo de vida de un correo por su <span class='mono'>DocumentId</span>; junio es horario de verano (UTC+2).</p><p><b>Respuestas (clave de corrección):</b></p><ul><li>Reto 1 (hash): una evidencia no cuadra al verificar su hash.</li><li>Reto 2: la cuenta <span class='mono'>abelardo.alcazar</span> envió <b>14</b> correos (aparentes) del 2 al 7 de junio.</li><li>Reto 3 (móvil): <b>Samsung</b> (S9) — \"Enviado desde mi Samsung S9\" en el correo \"Coltranistan ok\".</li><li>Reto 4: el archivo <span class='mono'>MINAF-Outlook-PC1.zip</span> está <b>corrupto</b>.</li><li>Reto 5 (1er \"COBALTO\"): enviado a las <b>16:02</b> UTC (18:02 local), hallado en Recoverable Items.</li><li>Reto 7 (cuentas): <span class='mono'>111-456789-234, 123-456789-211, 133-555444-666, 133-555555-346</span>.</li><li>Reto 8 (inicio de tecleo): <span class='mono'>PR_CREATION_TIME</span> 17:56:06 local → <b>15:56:06</b> UTC.</li><li>Reto 9 (campo único): <span class='mono'>PR_INTERNET_MESSAGE_ID</span> / <span class='mono'>MessageId</span>.</li><li>Reto 11 (DocumentId): <b>14386</b>.</li><li>Reto 12 (a papelera): <b>16:04:50</b> UTC · Reto 13 (borrado definitivo): <b>16:20:41</b> UTC.</li><li>Reto 14 (origen real): <span class='mono'>ClientCategory: OWA</span> → <b>OWA</b>.</li><li>Reto 15 (único correo real del CEO): \"Coltranistan ok\", <b>18:39</b> UTC (20:39 local).</li></ul><p>Conclusión: la suplantación se hizo por <b>OWA</b> mientras el CEO estaba de viaje y con el móvil inutilizado; los correos fraudulentos se borraron pero sobrevivieron en Recoverable Items y en el EventHistoryDB.</p>"}}, "ud4": {"act": {"4.1": "<p>Playbook por tipo de incidente con <b>fases NIST</b> (detección→triaje→contención→erradicación→recuperación→lecciones), cada acción con responsable, tiempo objetivo y criterio de salida, y etiquetas <span class='mono'>[VERIFICAR]</span> resueltas con comandos/IP reales de las VM. Validación: otro grupo lo ejecuta sin preguntar.</p>", "4.2": "<p>RTO/RPO por servicio, estrategia <b>3-2-1</b> implementada y <b>verificada restaurando</b>; segmentación con nftables (16 GB) o pfSense+DMZ (niv
